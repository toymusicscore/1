}

for (let i = 0; i < mscnt; i++) {

    if (!measurePc[i] || measurePc[i].count === 0) continue;

    measurePc[i].scale = new Array(12);

    for (let j = 0; j < 12; j++) {

        let scaleMember = 0;

        for (let k = 0; k < 12; k++) {
            if (scaleMjr0.includes((12 - j + k) % 12)) {
                scaleMember += measurePc[i].pc[k];
            }
        }

        measurePc[i].scale[j] = [
            scaleMember,
            scaleMember / measurePc[i].count * 100
        ];
    }
}


for (let i = 0; i < mscnt; i++) {

    if (!measurePc[i] || measurePc[i].count === 0) continue;

	measurePc[i].bestScale = [];

	let maxScore = -1;

	for (let j = 0; j < 12; j++) {

		const score = measurePc[i].scale[j][1];

		if (score > maxScore) {

			maxScore = score;
			measurePc[i].bestScale = [j];

		} else if (score === maxScore) {

			measurePc[i].bestScale.push(j);
		}
	}

	measurePc[i].bestScore = maxScore;
	measurePc[i].scaleMax = measurePc[i].bestScale.length;

}


//mltiple max weights
for(let i=0;i<mscnt;i++){
	for (let j = 0; j < 12; j++) {

		if (measurePc[i].scale[j][1] === measurePc[i].bestScore){	
			ctx.fillStyle = workingColor.pc[j];
			ctx.fillRect(100 + 50 * j, 90 + mscnt * 10 + 10 * i, 50, 10);
		}
		ctx.fillStyle = "black";

		const w1 = measurePc[i].scale[j][1].toFixed(2);

		if (w1 ==100){
			ctx.fillText(w1, 100 + 50 * j, 100 + mscnt * 10 + 10 * i);
		}else if (w1>=10){
			ctx.fillText(w1, 105 + 50 * j, 100 + mscnt * 10 + 10 * i);
		}else if (w1<10){
			ctx.fillText(w1, 110 + 50 * j, 100 + mscnt * 10 + 10 * i);
		}
	}
}

ctx.fillStyle="black";
ctx.fillText("Comparing total proportions of the 1st and the 5th pitch classes of the best relative keys",100,110+mscnt*20);
ctx.fillText("Measure",0,120+mscnt*20);
ctx.fillText("Scale",50,120+mscnt*20);

ctx.textAlign = "right";		
ctx.fillText("Major 1st+5th",230,120+mscnt*20);
ctx.fillText("Minor 1st+5th",480,120+mscnt*20);
ctx.fillText("Major",550,120+mscnt*20);
ctx.fillText("Minor",680,120+mscnt*20);
ctx.textAlign = "left";		
ctx.fillText("Estimated Key",700,120+mscnt*20);

let row = 0;

for (let i = 0; i < mscnt; i++) {

    if (!measurePc[i] || measurePc[i].count === 0) continue;

	measurePc[i].pairs = [];

    const scalePoint = 1 / measurePc[i].bestScale.length;

    for (const j of measurePc[i].bestScale) {

        const major = {
			measure: i+1,
            root: j,
            mode: "major",
            name: engf1[j] + " major",
            weight1: measurePc[i].pc[j] / measurePc[i].count * 100,
            weight5: measurePc[i].pc[(j + 7) % 12] / measurePc[i].count * 100
        };

        major.weight = major.weight1 + major.weight5;

        const minor = {
			measure: i+1,
            root: (j + 9) % 12,
            mode: "minor",
            name: engMnr1[(j + 9) % 12] + " minor",
            weight1: measurePc[i].pc[(j + 9) % 12] / measurePc[i].count * 100,
            weight5: measurePc[i].pc[(j + 4) % 12] / measurePc[i].count * 100
        };

        minor.weight = minor.weight1 + minor.weight5;

		const pair = {
			major: major,
			minor: minor,
			selected: [],
			point: scalePoint
		};
		if (major.weight > minor.weight) {

			pair.selected.push({
				key: major,
				point: scalePoint * (major.weight - minor.weight)
			});

		}
		else if (major.weight < minor.weight) {

			pair.selected.push({
				key: minor,
				point: scalePoint * (minor.weight - major.weight)
			});

		}
		else {

			pair.selected.push({
				key: major,
				point: 0
			});

			pair.selected.push({
				key: minor,
				point: 0
			});

		}

		measurePc[i].pairs.push(pair);

	}

	measurePc[i].keyPoints = [];

	for (const pair of measurePc[i].pairs){

		for (const item of pair.selected){

			if (item.point > 0) {

				measurePc[i].keyPoints.push([
					item.key.name,
					item.point
				]);

				// weight double for first & last
				if (i == 0 || i == mscnt - 1){

					measurePc[i].keyPoints.push([
						item.key.name,
						item.point
					]);
				}
			}
		}
	}

	measurePc[i].estKey =
		measurePc[i].pairs
			.flatMap(pair => pair.selected)
			.filter(item => item.point > 0)
			.map(item => item.key.name)
			.join(" / ");


    ctx.fillStyle = "black";
    ctx.fillText(measurePc[i].estKey,710,50+10*i);
    ctx.fillText(measurePc[i].estKey,710,100+mscnt*10+10*i);

	if (!measurePc[i]) continue;

	for (const pair of measurePc[i].pairs) {

		const majorKey = pair.major;
		const minorKey = pair.minor;

		const y = 120 + mscnt * 20 + 10 * row;
		const ry = y + 10;

		ctx.textAlign = "right";		
		// 小節番号（最初のペアだけ表示）
		if (pair === measurePc[i].pairs[0]) {	
			ctx.fillText(i + 1, 10, ry);
		}

		// major scale
		ctx.fillText(
			pair.major.name,
			90,
			ry
		);
		// 採用キー
		ctx.fillText(
			pair.selected
				.filter(k => k.point > 0)
				.map(k => k.key.name)
				.join(" / "),
			740,
			ry
		);

		// ===== Major 左側 =====

		// 第5音
		ctx.fillStyle = workingColor.pc[(majorKey.root + 7) % 12];
		ctx.fillRect(
			300 - majorKey.weight1 - majorKey.weight5,
			y,
			majorKey.weight5,
			10
		);

		// 第1音
		ctx.fillStyle = workingColor.pc[majorKey.root];
		ctx.fillRect(
			300 - majorKey.weight1,
			y,
			majorKey.weight1,
			10
		);


		// ===== Minor 右側 =====

		// 第1音
		ctx.fillStyle = workingColor.pc[minorKey.root];
		ctx.fillRect(
			300,
			y,
			minorKey.weight1,
			10
		);

		// 第5音
		ctx.fillStyle = workingColor.pc[(minorKey.root + 7) % 12];
		ctx.fillRect(
			300 + minorKey.weight1,
			y,
			minorKey.weight5,
			10
		);

		ctx.fillStyle = "black";

		const ty = y + 10;

		// Major
		ctx.fillText(
			majorKey.weight1.toFixed(2),
			140,
			ty
		);

		ctx.fillText(
			"+" + majorKey.weight5.toFixed(2),
			180,
			ty
		);

		ctx.fillText(
			"= " + majorKey.weight.toFixed(2),
			230,
			ty
		);


		// Minor
		ctx.fillText(
			minorKey.weight1.toFixed(2),
			390,
			ty
		);

		ctx.fillText(
			"+" + minorKey.weight5.toFixed(2),
			430,
			ty
		);

		ctx.fillText(
			"= " + minorKey.weight.toFixed(2),
			480,
			ty
		);
	
		const majorMinorDiff = majorKey.weight - minorKey.weight;

		if (majorMinorDiff > 0) {

			// Major優勢
			ctx.fillStyle = workingColor.pc[majorKey.root];

			ctx.fillRect(
				600 - majorMinorDiff,
				y,
				majorMinorDiff,
				10
			);

			ctx.fillStyle = "black";

			ctx.fillText(
				majorMinorDiff.toFixed(2),
				550,
				y + 10
			);

		}
		else if (majorMinorDiff < 0) {

			// Minor優勢
			ctx.fillStyle = workingColor.pc[minorKey.root];

			ctx.fillRect(
				600,
				y,
				-majorMinorDiff,
				10
			);

			ctx.fillStyle = "black";

			ctx.fillText(
				(-majorMinorDiff).toFixed(2),
				680,
				y + 10
			);
		}
		ctx.textAlign = "left";		

		row++;

	}	

}

	const points = {};

	for (let i = 0; i < measurePc.length; i++) {

		for (const [key, point] of measurePc[i].keyPoints) {

			points[key] = (points[key] || 0) + point;
		}
	}

	measurePc.keyPoints = Object.entries(points);
	measurePc.keyPoints.sort((a, b) => b[1] - a[1]);

	const total = measurePc.keyPoints.reduce((sum, [, w]) => sum + w, 0);

	const rowPointStart = Number(mscnt*30)+Number(row*10);

	ctx.fillStyle="black";
	ctx.fillText("Estimated Key",300,rowPointStart);
	ctx.fillText(val("song1"),300,rowPointStart+10);
	ctx.fillText("The First and Last Measures Count Double.",300,rowPointStart +210);
	ctx.fillText("If Multiple Scales Are Estimated for a Measure, the Points Are Divided Equally Among Them.",300, rowPointStart+220);

	ctx.textAlign = "right";		
	ctx.fillText("Estimated Key",70,rowPointStart);
	ctx.fillText("Point",150,rowPointStart);
	ctx.fillText("Weight",230,rowPointStart);

	for (let i = 0; i < measurePc.keyPoints.length; i++) {

		const y = rowPointStart + 10 * (i + 1);

		if (measurePc.keyPoints[i][1] == measurePc.keyPoints[0][1]) {

			ctx.fillStyle = "yellow";
			ctx.fillRect(0, y - 8, 230, 10);
		}

		ctx.fillStyle = "black";

		ctx.fillText(
			measurePc.keyPoints[i][0],
			70,
			y
		);

		ctx.fillText(
			measurePc.keyPoints[i][1].toFixed(2),
			150,
			y
		);

		ctx.fillText(
			(measurePc.keyPoints[i][1] / total * 100).toFixed(2) + "%",
			230,
			y
		);
	}

	ctx.textAlign = "left";		

	const cx = 500;      // 中心X
	const cy = 100 + rowPointStart;
	const r = 80;        // 半径

	let y = cy - r;

	let startAngle = -Math.PI / 2;   // 12時から開始

	for (let i = 0; i < measurePc.keyPoints.length; i++) {

		const ratio = measurePc.keyPoints[i][1] / total;
		const percent = ratio * 100;
		ctx.fillStyle = "black";

		const endAngle = startAngle + ratio * Math.PI * 2;

		// キー名から色を決定
		let keyName = measurePc.keyPoints[i][0];
		let root;

		if (keyName.includes("major")) {
			root = engf1.indexOf(keyName.replace(" major", ""));
		} else {
			root = engMnr1.indexOf(keyName.replace(" minor", ""));
		}

		const key = measurePc.keyPoints[i][0];

		let color = workingColor.pc[root];

		if (key.includes("minor")) {
			color = darkenColor(color, 0.8);
		}

		ctx.fillStyle = color;

		ctx.beginPath();
		ctx.moveTo(cx, cy);
		ctx.arc(cx, cy, r, startAngle, endAngle);
		ctx.closePath();
		ctx.fill();

		startAngle = endAngle;

		ctx.fillRect(cx + r + 30, y - 8, 12, 12);

		// 文字
		ctx.fillStyle = "black";
		ctx.fillText(
			`${key} ${percent.toFixed(2)}%`,
			cx + r + 50,
			y + 2
		);

		y += 18;

	}
}

function darkenColor(color, factor) {

    // "#"を除去
    color = color.replace("#", "");

    let r = parseInt(color.substring(0, 2), 16);
    let g = parseInt(color.substring(2, 4), 16);
    let b = parseInt(color.substring(4, 6), 16);

    r = Math.round(r * factor);
    g = Math.round(g * factor);
    b = Math.round(b * factor);

    return "#" +
        r.toString(16).padStart(2, "0") +
        g.toString(16).padStart(2, "0") +
        b.toString(16).padStart(2, "0");
}

function findNote(x,y){

    for(let i=0;i<notePosition.length;i++){

        const n = notePosition[i];

        if(
            Math.abs(x-n.x)<20 &&
            Math.abs(y-n.y)<20
        ){
            return i;
        }
    }

    return -1;
}

function selectNote(e){

    const index = findNote(
        e.offsetX,
        e.offsetY
    );

    if(index < 0) return;

    selectedNote =
        notePosition[index].note;

	showNoteMenu(
        e.clientX,
        e.clientY
    );
}

function editNote(e){

    const index = findNote(
        e.offsetX,
        e.offsetY
    );

    if(index < 0) return;

    selectedNote =
        notePosition[index].note;

    const n = notePosition[index];

    const rect = canvas.getBoundingClientRect();

    showNoteMenu(
        rect.left + n.x,
        rect.top + n.y
    );
}


function showNoteMenu(x, y){

    const menu = $("noteMenu");

    menu.style.left = x + "px";
    menu.style.top = y + "px";

    menu.style.display = "block";

    document.addEventListener("keydown", function(e){

        if(e.key === "Escape"){

            $("noteMenu").style.display = "none";

            selectedNote = null;
        }

    });

    document.addEventListener("keydown", function(e){

        if(e.key === "Escape"){
            hideNoteMenu();
        }

    });

}

function hideNoteMenu(){

    $("noteMenu").style.display = "none";

    selectedNote = null;
}

 const standardDeviation = (arr, usePopulation = false) => {
  // Calculate the mean of the array

const standardDeviation = (arr, usePopulation = false) => {
  if (!arr || arr.length === 0) return 0;
  if (!usePopulation && arr.length === 1) return 0;

  // 1. Calculate mean
  const mean = arr.reduce((acc, val) => acc + val, 0) / arr.length;
  
  // 2. Sum squared differences directly in one pass
  const sumOfSquaredDifferences = arr.reduce(
    (acc, val) => acc + (val - mean) ** 2, 
    0
  );
  
  // 3. Divide by N (population) or N - 1 (sample) and take square root
  const divisor = arr.length - (usePopulation ? 0 : 1);
  return Math.sqrt(sumOfSquaredDifferences / divisor);
};
