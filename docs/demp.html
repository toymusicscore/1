function findCommonMotifsFourWays(
    shapeEventDataRightA,
    shapeEventDataRightB,
    shapeEventDataLeftA,
    shapeEventDataLeftB
){

    const results = [];

    // =====================================
    // 4方向
    // =====================================

    const comparisons = [

        {
            type: "RA_RB",
            A: shapeEventDataRightA,
            B: shapeEventDataRightB
        },

        {
            type: "RA_LB",
            A: shapeEventDataRightA,
            B: shapeEventDataLeftB
        },

        {
            type: "LA_RB",
            A: shapeEventDataLeftA,
            B: shapeEventDataRightB
        },

        {
            type: "LA_LB",
            A: shapeEventDataLeftA,
            B: shapeEventDataLeftB
        }

    ];


    // =====================================
    // A/B直接比較
    // =====================================

    for(const comparison of comparisons){

        const candidates =
            findMotifEvent(
                comparison.A,
                comparison.B
            );


        for(const candidate of candidates){

            results.push({

                type:
                    comparison.type,

                startA:
                    candidate.startA,

                startB:
                    candidate.startB,

                length:
                    candidate.length,

                transpose:
                    candidate.transpose

            });

        }

    }


    return results;
}


function selectLongestCommonMotifs(candidates){

    // =====================================
    // 長い順
    // =====================================

    const sorted = [...candidates].sort(
        (a, b) => b.length - a.length
    );

    const selected = [];

    // =====================================
    // 候補を順番に確認
    // =====================================

    for(const candidate of sorted){

        let overlap = false;

        for(const motif of selected){

            // ---------------------------------
            // 方向が違えば別Motif
            // ---------------------------------

            if(candidate.type !== motif.type){
                continue;
            }

            // ---------------------------------
            // A側範囲
            // ---------------------------------

            const candidateEndA =
                candidate.startA +
                candidate.length;

            const motifEndA =
                motif.startA +
                motif.length;

            // ---------------------------------
            // B側範囲
            // ---------------------------------

            const candidateEndB =
                candidate.startB +
                candidate.length;

            const motifEndB =
                motif.startB +
                motif.length;

            // ---------------------------------
            // A側の重なり
            // ---------------------------------

            const overlapA =
                candidate.startA < motifEndA &&
                candidateEndA > motif.startA;

            // ---------------------------------
            // B側の重なり
            // ---------------------------------

            const overlapB =
                candidate.startB < motifEndB &&
                candidateEndB > motif.startB;

            // ---------------------------------
            // A/B両方で重なっていれば
            // 同じ領域のMotifとみなす
            // ---------------------------------

            if(
                overlapA &&
                overlapB
            ){

                overlap = true;
                break;
            }
        }

        // ---------------------------------
        // 重複しなければ採用
        // ---------------------------------

        if(!overlap){

            selected.push(candidate);
        }
    }

    return selected;
}


function groupCommonMotifs(
    commonMotifs,
    shapeEventDataRightA,
    shapeEventDataRightB,
    shapeEventDataLeftA,
    shapeEventDataLeftB
){

    const groups = new Map();


    const dataMap = {

        RA:
            shapeEventDataRightA,

        RB:
            shapeEventDataRightB,

        LA:
            shapeEventDataLeftA,

        LB:
            shapeEventDataLeftB

    };


    // =====================================
    // Common Motifをグループ化
    // =====================================

    for(
        const candidate
        of commonMotifs
    ){

        const [
            typeA,
            typeB
        ] =
            candidate.type.split("_");


        const dataA =
            dataMap[typeA];

        const dataB =
            dataMap[typeB];


        // =================================
        // A
        // =================================

        const patternA =
            getNormalizedPattern(
                dataA,
                candidate.startA,
                candidate.length
            );


        // =================================
        // B
        // =================================

        const patternB =
            getNormalizedPattern(
                dataB,
                candidate.startB,
                candidate.length
            );


        if(
            !patternA ||
            !patternB
        ){
            continue;
        }


        // =================================
        // A/Bのpattern確認
        // =================================

        if(
            patternA.length !==
            patternB.length
        ){
            continue;
        }


        let same = true;


        for(
            let i = 0;
            i < patternA.length;
            i++
        ){

            if(
                patternA[i] !==
                patternB[i]
            ){

                same = false;
                break;

            }

        }


        if(!same){
            continue;
        }


        // =================================
        // 重要
        //
        // typeはキーに含めない
        //
        // RA_RB
        // RA_LB
        // LA_RB
        // LA_LB
        //
        // でも同じpatternなら
        // 同じCommon Motif
        // =================================

        const key =
            candidate.length +
            ":" +
            patternA.join(",");


        if(!groups.has(key)){

            groups.set(
                key,
                {

                    length:
                        candidate.length,

                    pattern:
                        [...patternA],

                    RA: [],
                    RB: [],
                    LA: [],
                    LB: []

                }
            );

        }


        const group =
            groups.get(key);


        // =================================
        // A側
        // =================================

        group[typeA].push({

            start:
                candidate.startA,

            transpose:
                candidate.transpose

        });


        // =================================
        // B側
        // =================================

        group[typeB].push({

            start:
                candidate.startB,

            transpose:
                candidate.transpose

        });

    }


    // =====================================
    // 配列化
    // =====================================

    const result =
        Array.from(
            groups.values()
        );


    // =====================================
    // 出現位置の重複削除
    // =====================================

    for(
        const motif
        of result
    ){

        for(
            const hand
            of [
                "RA",
                "RB",
                "LA",
                "LB"
            ]
        ){

            const unique =
                new Map();


            for(
                const occurrence
                of motif[hand]
            ){

                const start =
                    occurrence.start;


                if(
                    !unique.has(start)
                ){

                    unique.set(
                        start,
                        {

                            start:
                                start,

                            transpose:
                                occurrence.transpose

                        }
                    );

                }

            }


            motif[hand] =
                Array.from(
                    unique.values()
                ).sort(
                    (a,b) =>
                        a.start - b.start
                );

        }

    }


    // =====================================
    // 長いMotifを優先
    // =====================================

    result.sort(
        (a,b) =>
            b.length - a.length
    );


    // =====================================
    // 上位10件
    // =====================================

    const topMotifs =
        result.slice(0, 10);


    // =====================================
    // Motif ID
    // =====================================

    topMotifs.forEach(
        (motif, index) => {

            motif.motifId =
                index + 1;

        }
    );


    return topMotifs;

}


function drawCommonMotifGraph(motifs){

    // =====================================
    // Canvas
    // =====================================

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =====================================
    // 上位10件
    // =====================================

    const commonMotifs =
        motifs.slice(0, 10);


    if(!commonMotifs.length){

        ctx.font =
            "14px sans-serif";

        ctx.fillStyle =
            "black";

        ctx.fillText(
            "No Common Motifs",
            30,
            40
        );

        return;
    }


    // =====================================
    // Event
    // =====================================

    const rightEventsA =
        Object.values(
            shapeEventDataRightA
        );

    const leftEventsA =
        Object.values(
            shapeEventDataLeftA
        );

    const rightEventsB =
        Object.values(
            shapeEventDataRightB
        );

    const leftEventsB =
        Object.values(
            shapeEventDataLeftB
        );


    // =====================================
    // 全Event
    // =====================================

    const allEventsA = [
        ...rightEventsA,
        ...leftEventsA
    ];

    const allEventsB = [
        ...rightEventsB,
        ...leftEventsB
    ];


    if(
        !allEventsA.length ||
        !allEventsB.length
    ){

        return;
    }


    // =====================================
    // 最大start
    // A
    // =====================================

    let maxStartA = 0;

    for(
        const event
        of allEventsA
    ){

        if(
            typeof event.start === "number" &&
            event.start > maxStartA
        ){

            maxStartA =
                event.start;
        }

    }


    // =====================================
    // 最大start
    // B
    // =====================================

    let maxStartB = 0;

    for(
        const event
        of allEventsB
    ){

        if(
            typeof event.start === "number" &&
            event.start > maxStartB
        ){

            maxStartB =
                event.start;
        }

    }


    // =====================================
    // 最後の小節
    // A / B 独立
    // =====================================

    const maxMeasureA =
        Math.floor(
            maxStartA /
            ticksPerMeasureA
        ) + 1;


    const maxMeasureB =
        Math.floor(
            maxStartB /
            ticksPerMeasureB
        ) + 1;


    // =====================================
    // 楽曲全体のtick範囲
    // =====================================

    const totalTicksA =
        maxMeasureA *
        ticksPerMeasureA;


    const totalTicksB =
        maxMeasureB *
        ticksPerMeasureB;


    // =====================================
    // サイズ
    // =====================================

    const measureWidth = 55;
    const eventWidth = 55;

    const axisWidth =
        measureWidth +
        eventWidth * 2;

    const handWidth = 65;

    const songWidth =
        handWidth * 2;

    const songGap = 45;

    const motifWidth =
        axisWidth * 2 +
        songWidth * 2 +
        songGap +
        20;

    const marginLeft = 10;

    const marginTop = 65;

    const graphTop = 105;


    // =====================================
    // 縦方向
    // A / B 独立
    // =====================================

    const maxGraphHeight =
        Math.min(
            700,
            window.innerHeight -
            graphTop -
            30
        );


    const timeScaleA =
        maxGraphHeight /
        totalTicksA;


    const timeScaleB =
        maxGraphHeight /
        totalTicksB;


    // =====================================
    // Canvas
    // =====================================

    canvas.width =
        marginLeft +
        commonMotifs.length *
        motifWidth +
        30;

    canvas.height =
        graphTop +
        maxGraphHeight +
        40;


    // =====================================
    // start → Y
    // A
    // =====================================

    function getYA(start){

        return (
            graphTop +
            start *
            timeScaleA
        );

    }


    // =====================================
    // start → Y
    // B
    // =====================================

    function getYB(start){

        return (
            graphTop +
            start *
            timeScaleB
        );

    }


    // =====================================
    // 全体の文字設定
    // =====================================

    ctx.fillStyle =
        "black";

    ctx.font =
        "11px sans-serif";

    ctx.textAlign =
        "right";


    // =====================================
    // Motif
    // =====================================

    commonMotifs.forEach(
        (motif, motifIndex) => {

            const x =
                marginLeft +
                motifIndex *
                motifWidth;


            // =================================
            // A / B の位置
            // =================================

            const aX =
                x;

            const bX =
                x +
                axisWidth +
                songWidth +
                songGap;


            // =================================
            // Motif区切り線
            // =================================

            ctx.strokeStyle =
                "#888";

            ctx.lineWidth =
                1;


            ctx.beginPath();

            ctx.moveTo(
                x,
                graphTop - 45
            );

            ctx.lineTo(
                x,
                graphTop +
                maxGraphHeight
            );

            ctx.stroke();


            // =================================
            // Title
            // =================================

            ctx.textAlign =
                "left";

            ctx.font =
                "bold 12px sans-serif";

            ctx.fillStyle =
                "black";


            ctx.fillText(
                "Common Motif " +
                (motifIndex + 1) +
                " (" +
                motif.length +
                ")",
                x + 5,
                marginTop
            );


            // =================================
            // Song A / Song B
            // =================================

            ctx.font =
                "bold 11px sans-serif";


            ctx.fillText(
                "Song A",
                aX +
                axisWidth +
                5,
                marginTop + 18
            );


            ctx.fillText(
                "Song B",
                bX +
                axisWidth +
                5,
                marginTop + 18
            );


            // =================================
            // A 軸ラベル
            // =================================

            ctx.font =
                "bold 9px sans-serif";

            ctx.textAlign =
                "right";


            ctx.fillText(
                "Measure A",
                aX +
                measureWidth -
                5,
                graphTop - 30
            );


            ctx.fillText(
                "L Event A",
                aX +
                measureWidth +
                eventWidth -
                5,
                graphTop - 30
            );


            ctx.fillText(
                "R Event A",
                aX +
                measureWidth +
                eventWidth * 2 -
                5,
                graphTop - 30
            );


            // =================================
            // B 軸ラベル
            // =================================

            ctx.fillText(
                "Measure B",
                bX +
                measureWidth -
                5,
                graphTop - 30
            );


            ctx.fillText(
                "L Event B",
                bX +
                measureWidth +
                eventWidth -
                5,
                graphTop - 30
            );


            ctx.fillText(
                "R Event B",
                bX +
                measureWidth +
                eventWidth * 2 -
                5,
                graphTop - 30
            );


            // =================================
            // Measure A
            // =================================

            ctx.font =
                "11px sans-serif";

            ctx.fillStyle =
                "black";


            for(
                let measure = 1;
                measure <= maxMeasureA;
                measure++
            ){

                const measureStart =
                    (measure - 1) *
                    ticksPerMeasureA;


                const y =
                    getYA(
                        measureStart
                    );


                ctx.fillText(
                    String(measure),
                    aX +
                    measureWidth -
                    5,
                    y + 14
                );

            }


            // =================================
            // Measure B
            // =================================

            for(
                let measure = 1;
                measure <= maxMeasureB;
                measure++
            ){

                const measureStart =
                    (measure - 1) *
                    ticksPerMeasureB;


                const y =
                    getYB(
                        measureStart
                    );


                ctx.fillText(
                    String(measure),
                    bX +
                    measureWidth -
                    5,
                    y + 14
                );

            }


            // =================================
            // A Event番号
            // =================================

            for(
                const event
                of leftEventsA
            ){

                if(
                    event.event % 10 !== 0
                ){
                    continue;
                }


                const y =
                    getYA(
                        event.start
                    );


                ctx.fillText(
                    String(event.event),
                    aX +
                    measureWidth +
                    eventWidth -
                    5,
                    y + 4
                );

            }


            for(
                const event
                of rightEventsA
            ){

                if(
                    event.event % 10 !== 0
                ){
                    continue;
                }


                const y =
                    getYA(
                        event.start
                    );


                ctx.fillText(
                    String(event.event),
                    aX +
                    measureWidth +
                    eventWidth * 2 -
                    5,
                    y + 4
                );

            }


            // =================================
            // B Event番号
            // =================================

            for(
                const event
                of leftEventsB
            ){

                if(
                    event.event % 10 !== 0
                ){
                    continue;
                }


                const y =
                    getYB(
                        event.start
                    );


                ctx.fillText(
                    String(event.event),
                    bX +
                    measureWidth +
                    eventWidth -
                    5,
                    y + 4
                );

            }


            for(
                const event
                of rightEventsB
            ){

                if(
                    event.event % 10 !== 0
                ){
                    continue;
                }


                const y =
                    getYB(
                        event.start
                    );


                ctx.fillText(
                    String(event.event),
                    bX +
                    measureWidth +
                    eventWidth * 2 -
                    5,
                    y + 4
                );

            }


            // =================================
            // 小節線 A
            // =================================

            for(
                let measure = 1;
                measure <= maxMeasureA;
                measure++
            ){

                const measureStart =
                    (measure - 1) *
                    ticksPerMeasureA;


                const y =
                    getYA(
                        measureStart
                    );


                ctx.strokeStyle =
                    "#cccccc";

                ctx.lineWidth =
                    1;


                ctx.beginPath();

                ctx.moveTo(
                    aX,
                    y
                );

                ctx.lineTo(
                    aX +
                    axisWidth +
                    songWidth,
                    y
                );

                ctx.stroke();

            }


            // =================================
            // 小節線 B
            // =================================

            for(
                let measure = 1;
                measure <= maxMeasureB;
                measure++
            ){

                const measureStart =
                    (measure - 1) *
                    ticksPerMeasureB;


                const y =
                    getYB(
                        measureStart
                    );


                ctx.strokeStyle =
                    "#cccccc";

                ctx.beginPath();

                ctx.moveTo(
                    bX,
                    y
                );

                ctx.lineTo(
                    bX +
                    axisWidth +
                    songWidth,
                    y
                );

                ctx.stroke();

            }


            // =================================
            // 手の描画関数
            // =================================

            function drawHandOccurrences(
                occurrences,
                shapeData,
                plotX,
                getY
            ){

                for(
                    const occurrence
                    of occurrences
                ){

                    for(
                        let i = 0;
                        i < motif.length;
                        i++
                    ){

                        const eventIndex =
                            occurrence.start +
                            i;


                        const event =
                            shapeData[
                                eventIndex
                            ];


                        if(!event){
                            continue;
                        }


                        // =================================
                        // Event内の各note
                        // =================================

                        for(
                            const point
                            of event.points
                        ){

                            const start =
                                point.start;


                            const pitchClass =
                                point.pitchClass;


                            const y =
                                getY(start);


                            const px =
                                plotX +
                                (
                                    pitchClass +
                                    0.5
                                ) *
                                (
                                    handWidth /
                                    12
                                );


                            ctx.fillStyle =
                                workingColor.pc[
                                    pitchClass
                                ];


                            ctx.beginPath();

                            ctx.arc(
                                px,
                                y,
                                3,
                                0,
                                Math.PI * 2
                            );

                            ctx.fill();

                        }

                    }

                }

            }


            // =================================
            // A Left
            // =================================

            drawHandOccurrences(
                motif.LA || [],
                shapeEventDataLeftA,
                aX +
                axisWidth,
                getYA
            );


            // =================================
            // A Right
            // =================================

            drawHandOccurrences(
                motif.RA || [],
                shapeEventDataRightA,
                aX +
                axisWidth +
                handWidth,
                getYA
            );


            // =================================
            // B Left
            // =================================

            drawHandOccurrences(
                motif.LB || [],
                shapeEventDataLeftB,
                bX +
                axisWidth,
                getYB
            );


            // =================================
            // B Right
            // =================================

            drawHandOccurrences(
                motif.RB || [],
                shapeEventDataRightB,
                bX +
                axisWidth +
                handWidth,
                getYB
            );


            // =================================
            // A 手ラベル
            // =================================

            ctx.textAlign =
                "center";

            ctx.font =
                "bold 10px sans-serif";

            ctx.fillStyle =
                "black";


            ctx.fillText(
                "LA",
                aX +
                axisWidth +
                handWidth / 2,
                marginTop + 35
            );


            ctx.fillText(
                "RA",
                aX +
                axisWidth +
                handWidth +
                handWidth / 2,
                marginTop + 35
            );


            // =================================
            // B 手ラベル
            // =================================

            ctx.fillText(
                "LB",
                bX +
                axisWidth +
                handWidth / 2,
                marginTop + 35
            );


            ctx.fillText(
                "RB",
                bX +
                axisWidth +
                handWidth +
                handWidth / 2,
                marginTop + 35
            );


            // =================================
            // Motifの範囲を四角で囲む
            // =================================

            ctx.strokeStyle =
                "#555";

            ctx.lineWidth =
                1.5;


            // =================================
            // A Left
            // =================================

            for(
                const occurrence
                of motif.LA || []
            ){

                const firstEvent =
                    shapeEventDataLeftA[
                        occurrence.start
                    ];

                const lastEvent =
                    shapeEventDataLeftA[
                        occurrence.start +
                        motif.length -
                        1
                    ];


                if(
                    !firstEvent ||
                    !lastEvent
                ){
                    continue;
                }


                const y1 =
                    getYA(
                        firstEvent.start
                    );

                const y2 =
                    getYA(
                        lastEvent.start
                    );


                ctx.strokeRect(
                    aX +
                    axisWidth,
                    y1 - 4,
                    handWidth,
                    (y2 - y1) + 8
                );

            }


            // =================================
            // A Right
            // =================================

            for(
                const occurrence
                of motif.RA || []
            ){

                const firstEvent =
                    shapeEventDataRightA[
                        occurrence.start
                    ];

                const lastEvent =
                    shapeEventDataRightA[
                        occurrence.start +
                        motif.length -
                        1
                    ];


                if(
                    !firstEvent ||
                    !lastEvent
                ){
                    continue;
                }


                const y1 =
                    getYA(
                        firstEvent.start
                    );

                const y2 =
                    getYA(
                        lastEvent.start
                    );


                ctx.strokeRect(
                    aX +
                    axisWidth +
                    handWidth,
                    y1 - 4,
                    handWidth,
                    (y2 - y1) + 8
                );

            }


            // =================================
            // B Left
            // =================================

            for(
                const occurrence
                of motif.LB || []
            ){

                const firstEvent =
                    shapeEventDataLeftB[
                        occurrence.start
                    ];

                const lastEvent =
                    shapeEventDataLeftB[
                        occurrence.start +
                        motif.length -
                        1
                    ];


                if(
                    !firstEvent ||
                    !lastEvent
                ){
                    continue;
                }


                const y1 =
                    getYB(
                        firstEvent.start
                    );

                const y2 =
                    getYB(
                        lastEvent.start
                    );


                ctx.strokeRect(
                    bX +
                    axisWidth,
                    y1 - 4,
                    handWidth,
                    (y2 - y1) + 8
                );

            }


            // =================================
            // B Right
            // =================================

            for(
                const occurrence
                of motif.RB || []
            ){

                const firstEvent =
                    shapeEventDataRightB[
                        occurrence.start
                    ];

                const lastEvent =
                    shapeEventDataRightB[
                        occurrence.start +
                        motif.length -
                        1
                    ];


                if(
                    !firstEvent ||
                    !lastEvent
                ){
                    continue;
                }


                const y1 =
                    getYB(
                        firstEvent.start
                    );

                const y2 =
                    getYB(
                        lastEvent.start
                    );


                ctx.strokeRect(
                    bX +
                    axisWidth +
                    handWidth,
                    y1 - 4,
                    handWidth,
                    (y2 - y1) + 8
                );

            }

        }
    );


    // =====================================
    // 右端のMotif区切り線
    // =====================================

    const lastX =
        marginLeft +
        commonMotifs.length *
        motifWidth;


    ctx.strokeStyle =
        "#888";

    ctx.lineWidth =
        1;


    ctx.beginPath();

    ctx.moveTo(
        lastX,
        graphTop - 45
    );

    ctx.lineTo(
        lastX,
        graphTop +
        maxGraphHeight
    );

    ctx.stroke();


    ctx.textAlign =
        "left";

}


function getPitchClassQuery(){

    const input =
        $("pitchClassInput").value.trim();

    console.log(
        "pitchClass raw input =",
        input
    );

    if(!input){
        return [];
    }

    const pattern = [];

    // -----------------------------------------
    // [] の中を和音として扱う
    // -----------------------------------------

    const tokens =
        input.match(
            /\[[^\]]*\]|[^,\s]+/g
        );

    if(!tokens){
        return [];
    }

    for(const token of tokens){

        // -------------------------------------
        // 和音 [0,4,7]
        // -------------------------------------

        if(
            token.startsWith("[") &&
            token.endsWith("]")
        ){

            const chordText =
                token.slice(1, -1);

            const chord =
                chordText
                .split(/[\s,]+/)
                .map(Number)
                .filter(
                    x =>
                        Number.isInteger(x) &&
                        x >= 0 &&
                        x <= 11
                );

            if(chord.length > 0){

                // Pitch Class の順序を統一
                chord.sort(
                    (a, b) => a - b
                );

                pattern.push(chord);
            }

        }else{

            // ---------------------------------
            // 単音
            // ---------------------------------

            const pc =
                Number(token);

            if(
                Number.isInteger(pc) &&
                pc >= 0 &&
                pc <= 11
            ){

                pattern.push(pc);
            }
        }
    }

    console.log(
        "pitchClass pattern =",
        pattern
    );

    return pattern;
}

function comparePitchClassPattern(patternA, patternB){

    if(patternA.length !== patternB.length){
        return null;
    }

    if(patternA.length === 0){
        return null;
    }

    const transpose =
        (patternB[0] - patternA[0] + 12) % 12;

    for(let i = 0; i < patternA.length; i++){

        const pc =
            (patternA[i] + transpose) % 12;

        if(pc !== patternB[i]){
            return null;
        }
    }

    return transpose;
}


function parsePitchClassToken(token){

    // -----------------------------------------
    // 和音
    // -----------------------------------------

    if(
        token.startsWith("[") &&
        token.endsWith("]")
    ){

        const inside =
            token.slice(1, -1).trim();

        if(!inside){
            return undefined;
        }

        const values =
            inside
            .split(",")
            .map(Number)
            .filter(
                x =>
                    Number.isInteger(x) &&
                    x >= 0 &&
                    x <= 11
            )
            .sort((a, b) => a - b);

        if(values.length === 0){
            return undefined;
        }

        return values;
    }

    // -----------------------------------------
    // 単音
    // -----------------------------------------

    const value =
        Number(token);

    if(
        Number.isInteger(value) &&
        value >= 0 &&
        value <= 11
    ){
        return value;
    }

    return undefined;
}

function getEventPitchClasses(event){

    if(!event || !event.points){
        return [];
    }

    return event.points
        .map(p => p.pitchClass)
        .filter(
            pc =>
                Number.isInteger(pc) &&
                pc >= 0 &&
                pc <= 11
        )
        .sort(
            (a, b) => a - b
        );
}

function searchPitchClassInEventData(
    eventData,
    queryPattern,
    hand,
    scoreName,
    songFileName
){

    const events =
        Object.values(eventData);

    const results = [];

    const queryLength =
        queryPattern.length;

    if(queryLength === 0){
        return results;
    }


    // -----------------------------------------
    // イベントを Pitch Class 配列に変換
    // -----------------------------------------

    const eventPatterns =
        events.map(
            event => getEventPitchClasses(event)
        );


    // -----------------------------------------
    // イベント列を検索
    // -----------------------------------------

    for(
        let i = 0;
        i <= events.length - queryLength;
        i++
    ){

        // -------------------------------------
        // 最初のイベント
        // -------------------------------------

        const firstEvent =
            eventPatterns[i];

        if(firstEvent.length === 0){
            continue;
        }


        // -------------------------------------
        // 最初のイベントから transpose を決める
        //
        // 単音なら queryPattern[0]
        // 和音なら最初の音
        // -------------------------------------

        const firstQuery =
            Array.isArray(queryPattern[0])
                ? queryPattern[0][0]
                : queryPattern[0];


        const firstEventPC =
            firstEvent[0];


        const transpose =
            (
                firstEventPC -
                firstQuery +
                12
            ) % 12;


        let match = true;


        // -------------------------------------
        // 各イベントを比較
        // -------------------------------------

        for(
            let j = 0;
            j < queryLength;
            j++
        ){

            const query =
                queryPattern[j];

            const eventPCs =
                eventPatterns[i + j];


            // ---------------------------------
            // 検索パターンが単音
            // ---------------------------------

            if(!Array.isArray(query)){

                const expectedPC =
                    (
                        query +
                        transpose
                    ) % 12;

                if(
                    eventPCs.length !== 1 ||
                    eventPCs[0] !== expectedPC
                ){

                    match = false;
                    break;
                }

            }

            // ---------------------------------
            // 検索パターンが和音
            // ---------------------------------

            else{

                const expectedChord =
                    query
                    .map(
                        pc =>
                            (
                                pc +
                                transpose
                            ) % 12
                    )
                    .sort(
                        (a, b) => a - b
                    );


                if(
                    eventPCs.length !==
                    expectedChord.length
                ){

                    match = false;
                    break;
                }


                for(
                    let k = 0;
                    k < expectedChord.length;
                    k++
                ){

                    if(
                        eventPCs[k] !==
                        expectedChord[k]
                    ){

                        match = false;
                        break;
                    }
                }


                if(!match){
                    break;
                }
            }
        }


        // -------------------------------------
        // 一致
        // -------------------------------------

        if(match){

            results.push({

                song: 
                    songFileName,

                score:
                    scoreName,

                hand:
                    hand,

                startEvent:
                    i,

                endEvent:
                    i +
                    queryLength -
                    1,

                transpose:
                    transpose,

                pattern:
                    eventPatterns
                    .slice(
                        i,
                        i + queryLength
                    ),

                start:
                    events[i].start,

                stop:
                    events[
                        i +
                        queryLength -
                        1
                    ].start
            });
        }
    }


    return results;
}

function lineScore(tick){
    notePosition = [];
	ctx.clearRect(0,0,canvas.width,canvas.height);
	szx = canvas.width;
	szy = canvas.height-2*my;
	szk = szx-2*mx;
	ctx.lineWidth=1;
	let scoreViewData;
	
	const view = getViewInfo();

	for(let l=0;l<Number(view.kn);l++){
		let k=Number(view.midi_min)+l;
		ctx.fillStyle=workingColor.oct[Math.floor(k/12)-1];
		ctx.fillRect(mx+l*view.kw,0,view.kw,my/2);
		ctx.fillStyle=workingColor.pc[k%12];
		ctx.fillRect(mx+l*view.kw,my/2,view.kw,my/2);
		if (k%12===1 || k%12===3 || k%12===6 || k%12===8 || k%12===10){
		ctx.fillStyle=workingColor.line[0];
		ctx.fillRect(mx+l*view.kw,my,view.kw,szy);
		}else if (k%12===0){
		ctx.beginPath();
		ctx.moveTo(mx+l*view.kw,my);
		ctx.lineTo(mx+l*view.kw,my+szy);
		ctx.strokeStyle=workingColor.line[1];
		ctx.stroke();
		}else if (k%12===5){
		ctx.beginPath();
		ctx.moveTo(mx+l*view.kw,my);
		ctx.lineTo(mx+l*view.kw,my+szy);
		ctx.strokeStyle=workingColor.line[2];
		ctx.stroke();
		}
	}

	if (tick<songLengthTicks){
		ctx.beginPath();
		ctx.moveTo(0,my+tick%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure));
		ctx.lineTo(szx,my+tick%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure));
		ctx.strokeStyle=workingColor.line[5];
		ctx.stroke();
	} else {
		isPlaying = false;
	}

	ctx.beginPath();
	ctx.moveTo(0,my+szy);
	ctx.lineTo(mx+szk,my+szy);
	ctx.strokeStyle=workingColor.line[3];
	ctx.stroke();

	for(let m=0;m<songLengthTicks;m=m+ticksPerQuarterNote/timeSignatureDenominator*4){
		if(m%(ticksPerMeasure)===0 && m>=tick && m<(tick+measuresPerScreen*ticksPerMeasure)){
			let vmn0=m/ticksPerMeasure+1;
			ctx.beginPath();
			ctx.moveTo(0,my+m%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure));
			ctx.lineTo(mx+szk,my+m%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure));
			ctx.strokeStyle=workingColor.line[3];
			ctx.stroke();
			if(vmn0 === highlightMeasure){
				ctx.fillStyle = workingColor.text[5];
				ctx.font = "bold 30px Arial";
			}else{
				ctx.fillStyle = workingColor.text[0];
				ctx.font = "25px Arial";
			}
			ctx.textAlign = "left";
			ctx.fillText(vmn0,0,my+25+m%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure));
		}else if(m%(ticksPerQuarterNote/timeSignatureDenominator*4)===0 && m>=tick && m<(tick+measuresPerScreen*ticksPerMeasure)){
			ctx.beginPath();
			ctx.moveTo(mx,my+m%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure));
			ctx.lineTo(mx+szk,my+m%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure));
			ctx.strokeStyle=workingColor.line[4];
			ctx.stroke();
			}
	}

	for(let i=0;i<view.scoreViewData.length;i++){
		let midi = view.scoreViewData[i].midi;
		let start = view.scoreViewData[i].start;
		let stop = view.scoreViewData[i].stop;
		let track = view.scoreViewData[i].track;
		let channel = view.scoreViewData[i].channel;
		let n_id = view.scoreViewData[i].n_id;
		const dt = (start-tick)/ticksPerMeasure;
		const dp = (stop-tick)/ticksPerMeasure;
		const gt = getVisibleLength(
			start,
			stop,
			tick
		);

		let handColor =
			workingColor.hand[
				HAND_COLOR.SCORE_NOT_ASSIGNED
			];

		if(track == practiceSettings.handsTrackChannel.right.track
		 && channel == practiceSettings.handsTrackChannel.right.channel){
			handColor =
				workingColor.hand[
					HAND_COLOR.SCORE_RIGHT
				];
		}
		else if(track == practiceSettings.handsTrackChannel.left.track
		 && channel == practiceSettings.handsTrackChannel.left.channel){
			handColor =
				workingColor.hand[
					HAND_COLOR.SCORE_LEFT
				];
		}
		if (dp >=0 && dt < measuresPerScreen*3/4){
			const x0 = (midi-view.midi_min)*view.kw+mx;
			const x1 = (midi-view.midi_min+0.5)*view.kw+mx;
			const y = my+start%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure);
			if (!isFinite(x0) || !isFinite(y) || !isFinite(gt)){
					continue;
				}

            notePosition.push({
                note: view.scoreViewData[i],
                x: x1,
                y: y
            });

		if(markerVisible && view.scoreViewData[i].marker){
			let size = view.kw;

			switch(view.scoreViewData[i].marker.shape){

				case "Circle":

					ctx.beginPath();
					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;

					ctx.arc(x1, y, 0.8 * Number(size), 0, Math.PI * 2);

					ctx.stroke();
				break;


				case "Square":

					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;

					ctx.strokeRect(
						x1 - 0.7 * Number(size),
						y - 0.7 * Number(size),
						1.4 * Number(size),
						1.4 * Number(size)
					);

				break;


				case "Triangle":
					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawTriangle(ctx, x1, y, 0.9 * Number(size));
				break;

				case "Heart":
					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawHeart(ctx, x1, y, 1.3 * Number(size));
				break;

				case "Diamond":
					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawDiamond(ctx, x1, y, 0.9 * Number(size));
				break;

				case "Star":
					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawStar(ctx, x1, y, size);
				break;

				case "Pentagon":
					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawPentagon(ctx, x1, y, 0.9 * Number(size));
				break;
				
				case "Hexagon":
					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawHexagon(ctx, x1, y, 0.9 * Number(size));

					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawPolygon(ctx, x1, y, 0.9 * Number(size), 7);

					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;
					drawPolygon(ctx, x1, y, 0.9 * Number(size), 8);

					ctx.strokeStyle = view.scoreViewData[i].marker.color;
					ctx.lineWidth = view.scoreViewData[i].marker.width;

			ctx.fillStyle=workingColor.pc[midi%12];

function lineRecord(tick){

	lineScore(tick);

	const view = getViewInfo();

	for(let i=0; i<recordData.length; i++){
		let midi = recordData[i].midi;
		let start = recordData[i].start;
		let stop = recordData[i].stop;
		if(stop == null){
			continue;
		}
		const dt = (start-tick)/ticksPerMeasure;
		const dp = (stop-tick)/ticksPerMeasure;

		if (dp > 0 && dt < measuresPerScreen*3/4){

			const x0 = (midi-midi_min)*view.kw+mx;
			const x1 = (midi-midi_min+0.5)*view.kw+mx;
			const y = my+start%(measuresPerScreen*ticksPerMeasure)*szy/(measuresPerScreen*ticksPerMeasure);
			const gt = getVisibleLength(
				start,
				stop,
				tick
			);

			if (!isFinite(x0) || !isFinite(y) || !isFinite(gt) || !showRecord){
				continue;
			}

			ctx.fillStyle =
				workingColor.hand[
					HAND_COLOR.RECORD_BOTH_BAR
				];
			ctx.fillRect(
				x0 + view.kw/4,
				y,
				view.kw/2,
				gt*szy/measuresPerScreen
			);

			ctx.beginPath();
			ctx.fillStyle =
				workingColor.hand[
					HAND_COLOR.RECORD_BOTH_CIRCLE
				];
			ctx.fillStyle = workingColor.hand[2];
			ctx.arc(x1,y,view.kw/4,0,2*Math.PI,false);
			ctx.fill();
		}
	}
};

function calcPitchAccuracy(diffData){

    let correct = 0;
    let count = 0;

    for(const d of diffData){

        if(d.missed || d.extra){
            continue;
        }

        count++;

        if(d.pitchDiff === 0){
            correct++;
        }
    }

    if(count === 0){
        return 0;
    }

    return Math.round(correct / count * 100);
}

function calcAttackAccuracy(diffData){

    let total = 0;
	let count = 0;

	for(const d of diffData){

        if(d.missed || d.extra){
            continue;
        }

        count++;

		const err =
            Math.abs(d.attackDiff);

        let score;

        if(err <= ticksPerQuarterNote * 0.05){

            score = 100;

        }else if(err <= ticksPerQuarterNote * 0.10){

            score = 90;

        }else if(err <= ticksPerQuarterNote * 0.20){

            score = 70;

        }else if(err <= ticksPerQuarterNote * 0.30){

            score = 40;

        }else{

            score = 0;
        }

        total += score;
    }

    return count ? Math.round(total / count) : 0;
}

function calcReleaseAccuracy(diffData){

    let total = 0;
	let count = 0;

	for(const d of diffData){

        if(d.missed || d.extra){
            continue;
        }

        count++;

        const err =
            Math.abs(d.releaseDiff);

        let score;

        if(err <= ticksPerQuarterNote * 0.05){

            score = 100;

        }else if(err <= ticksPerQuarterNote * 0.10){

            score = 90;

        }else if(err <= ticksPerQuarterNote * 0.20){

            score = 70;

        }else if(err <= ticksPerQuarterNote * 0.30){

            score = 40;

        }else{

            score = 0;
        }

        total += score;
    }

    return count ? Math.round(total / count) : 0;
}


function calcVelocityAccuracy(diffData){

    let total = 0;
	let count = 0;

	for(const d of diffData){

        if(d.missed || d.extra){
            continue;
        }

        count++;

        const err =
            Math.abs(d.velocityDiff);

        let score;

        if(err <= 5){

            score = 100;

        }else if(err <= 10){

            score = 90;

        }else if(err <= 20){

            score = 70;

        }else if(err <= 40){

            score = 40;

        }else{

            score = 0;
        }

        total += score;
    }

    return count ? Math.round(total / count) : 0;
}


function calcOverallAccuracy(diffData){

	const pitchAccuracy = Math.round(calcPitchAccuracy(diffData));
	const attackAccuracy = Math.round(calcAttackAccuracy(diffData));
	const releaseAccuracy = Math.round(calcReleaseAccuracy(diffData));
	const velocityAccuracy = Math.round(calcVelocityAccuracy(diffData));

	const Overall = Math.round(
		0.5 * pitchAccuracy +
		0.25 * attackAccuracy +
		0.2 * releaseAccuracy +
		0.05 * velocityAccuracy
	);

	return Overall;
}

function drawGraph(
    diffData,
    key,
    title,
    offsetY,
    color,
    scaleY,
    showMeasureLabel
){
	
    const graphHeight = 100;

	const titleHeight = 30;

    const w = canvas.width - 2 * mx;

    const centerY =
        offsetY + graphHeight / 2;

    // タイトル
    ctx.fillStyle = "black";

    ctx.font = "20px sans-serif";

    ctx.fillText(
        title,
        50,
        offsetY + 20
    );

    // 中央線
    ctx.strokeStyle = "#888";

    ctx.beginPath();

    ctx.moveTo(
        mx,
        centerY
    );

    ctx.lineTo(
        mx + w,
        centerY
    );

    ctx.stroke();

	const maxTick =
		Math.max(
			...scoreData.map(n => n.start)
		);
		
	// --------------------
    // 小節線だけ描画
    // --------------------

		ctx.strokeStyle = "#ddd";

		ctx.fillStyle = "black";
	
		const drawnMeasures =
		new Set();

	for(let i = 0; i < diffData.length; i++){

		const measure =
			diffData[i].measure;

		if(
			drawnMeasures.has(
				measure
			)
		){
			continue;
		}

		drawnMeasures.add(
			measure
		);

		const x = mx + diffData[i].tick / maxTick * w;

		const maxMeasure =
    		diffData[diffData.length - 1].measure;

		const maxLabels = 30;

		const measureStep =
			Math.max(
				1,
				Math.ceil(maxMeasure / maxLabels)
			);

		if(
			showMeasureLabel
			&&
			(measure - 1) % measureStep === 0
		){
			ctx.fillText(
				measure,
				x,
				offsetY + graphHeight
			);
		}

		ctx.beginPath();

		ctx.moveTo(
			x,
			offsetY + titleHeight
		);

		ctx.lineTo(
			x,
			offsetY +
			(graphHeight - titleHeight)
		);

		ctx.stroke();
	}
    // --------------------
    // 折れ線描画
    // --------------------

    ctx.strokeStyle = color;

    ctx.fillStyle = color;

    ctx.lineWidth = 2;

    ctx.beginPath();

	for(let i = 0; i < diffData.length; i++){

		const x =
			mx +
			diffData[i].tick
			/ maxTick
			* w;

		const y =
			centerY
			-
			diffData[i][key] * scaleY;

			// 点
			ctx.fillRect(
				x - 2,
				y - 2,
				4,
				4
			);

			// 折れ線
			if(i === 0){

				ctx.moveTo(x, y);

			}else{

				ctx.lineTo(x, y);
			}
		}

    ctx.stroke();
}

function drawPedalGraph(
    pedalData,
    title,
    offsetY,
	color,
    showMeasureLabel

){

	if(pedalData.length === 0){
    return;
	}
	
	const pedalGraphData = [];

	for(const p of pedalData){

		pedalGraphData.push({

			cc: p.cc,

			measure:
				Math.floor(
					p.start / ticksPerMeasure
				) + 1,

			tick: p.start,

			pedalValue: p.value
		});
	}

    const graphHeight = 100;

	const titleHeight = 30;

    const w = canvas.width - 2 * mx;

	const topY = offsetY + 40;

	const bottomY = offsetY + 80;

	const maxTick =
		Math.max(
			...scoreData.map(n => n.start)
		);		

	// タイトル

	ctx.fillStyle = "black";

    ctx.font = "20px sans-serif";

    ctx.fillText(
        title,
        50,
        offsetY + 20
    );
		
	// --------------------
    // 小節線だけ描画
    // --------------------
	ctx.strokeStyle = "#ddd";

	ctx.fillStyle = "black";

	const totalMeasures =
		Math.ceil(
			maxTick / ticksPerMeasure
		);

	for(
		let m = 1;
		m <= totalMeasures;
		m++
	){

		const tick =
			(m - 1) * ticksPerMeasure;

		const x =
			mx +
			tick / maxTick * w;

		if(showMeasureLabel){

			ctx.fillText(
				m,
				x,
				offsetY + graphHeight
			);
		}

		ctx.beginPath();

		ctx.moveTo(
			x,
			offsetY + titleHeight
		);

		ctx.lineTo(
			x,
			offsetY + (graphHeight - titleHeight)
		);

		ctx.stroke();
	}

    // --------------------
    // 折れ線描画
    // --------------------

    ctx.strokeStyle = color;

    ctx.fillStyle = color;

    ctx.lineWidth = 2;

	
	let prevY = null;

	ctx.beginPath();

	for(let i = 0; i < pedalGraphData.length; i++){

		const x =
			mx +
			pedalGraphData[i].tick / maxTick * w;

		const y =
			bottomY
			-
			pedalGraphData[i].pedalValue / 127
			*
			(bottomY - topY);

		if(i === 0){

			ctx.moveTo(x, y);

		}else{

			ctx.lineTo(x, prevY);
			ctx.lineTo(x, y);
		}

		prevY = y;
	}

	const lastX =
		mx + w;

	ctx.lineTo(
		lastX,
		prevY
	);

	ctx.stroke();
}

function matchNotes(scoreData, recordData){

    const m = scoreData.length;
    const n = recordData.length;

    const dp = [];
	const MISS_COST = 50;

    for(let i=0; i<=m; i++){

        dp[i] = [];

        for(let j=0; j<=n; j++){

            dp[i][j] = Infinity;
        }
    }

    dp[0][0] = 0;

    for(let i=0; i<=m; i++){

        for(let j=0; j<=n; j++){

            if(i < m && j < n){

                const s = scoreData[i];
                const r = recordData[j];

                const pitchCost =
                    Math.abs(s.midi - r.midi);

                const timeCost =
                    Math.abs(s.start - r.start) / 100;

				const durationCost =
					Math.abs(
						(s.stop - s.start)
						-
						(r.stop - r.start)
					) / 100;

				const matchCost =
					pitchCost * 10 +
					timeCost +
					durationCost;

                dp[i+1][j+1] =
                    Math.min(
                        dp[i+1][j+1],
                        dp[i][j] + matchCost
                    );
            }

            // 楽譜側欠落
            if(i < m){

                dp[i+1][j] =
                    Math.min(
                        dp[i+1][j],
                        dp[i][j] + MISS_COST
                    );
            }

            // 余計な音
            if(j < n){

                dp[i][j+1] =
                    Math.min(
                        dp[i][j+1],
                        dp[i][j] + MISS_COST
                    );
            }
        }
    }

    const pairs = [];

    let i = m;
    let j = n;

    while(i > 0 || j > 0){

        if(
            i > 0 &&
            j > 0
        ){

            const s = scoreData[i-1];
            const r = recordData[j-1];

            const pitchCost =
                Math.abs(s.midi - r.midi);

            const timeCost =
                Math.abs(s.start - r.start) / 100;

			const durationCost =
				Math.abs(
					(s.stop - s.start)
					-
					(r.stop - r.start)
				) / 100;

			const matchCost =
				pitchCost * 10 +
				timeCost +
				durationCost;

            if(
                Math.abs(
                    dp[i][j] -
                    (dp[i-1][j-1] + matchCost)
                ) < 0.0001
            ){

                pairs.unshift({

                    scoreIndex: i-1,
                    recordIndex: j-1,

                    score: s,
                    record: r

                });

                i--;
                j--;

                continue;
            }
        }

        if(
            i > 0 &&
            Math.abs(
                dp[i][j] -
                (dp[i-1][j] + MISS_COST)
            ) < 0.0001
        ){

            pairs.unshift({

                scoreIndex: i-1,
                recordIndex: null,

                score: scoreData[i-1],
                record: null

            });

            i--;

            continue;
        }

        if(j > 0){

            pairs.unshift({

                scoreIndex: null,
                recordIndex: j-1,

                score: null,
                record: recordData[j-1]

            });

            j--;
        }
    }

    return pairs;

	const matched =
		pairs.filter(
			p => p.score && p.record
		);

	console.log(
		"matched",
		matched.length
	);

}


function createDiffData(pairs){

    diffData = [];   // ←追加

	for(const pair of pairs){

		// 弾き忘れ
		if(
			pair.score != null &&
			pair.record == null
		){

			diffData.push({

				missed: true,

				tick:
					pair.score.start,

				measure:
					Math.floor(
						pair.score.start /
						ticksPerMeasure
					) + 1
			});

			continue;
		}

		// 余計な音
		if(
			pair.score == null &&
			pair.record != null
		){

			diffData.push({

				extra: true,

				tick:
					pair.record.start,

				measure:
					Math.floor(
						pair.record.start /
						ticksPerMeasure
					) + 1
			});

			continue;
		}

		const s = pair.score;
		const r = pair.record;

		diffData.push({

			tick: s.start,

			pitchDiff:
				r.midi - s.midi,

			attackDiff:
				r.start - s.start,

			releaseDiff:
				r.stop - s.stop,

			velocityDiff:
				r.velocity -
				s.velocity,

			measure:
				Math.floor(
					s.start /
					ticksPerMeasure
				) + 1
		});
	}

	diffData.sort(
		(a,b) => a.tick - b.tick
	);

    return diffData;

}

function createPracticeStats(diffData){

    const stats = {};

    for(const d of diffData){
    
        const m = d.measure;

        if(!stats[m]){

			stats[m] = {
				measure: m,
				missed: 0,
				extra: 0,
				pitch: 0,
				attack: 0,
				release: 0,
				velocity: 0,
				total: 0
			};
        }

		if(d.missed){
			stats[m].missed++;
			stats[m].total += 10;
			continue;
		}

		if(d.extra){
			stats[m].extra++;
			stats[m].total += 5;
			continue;
		}

		if(Math.abs(d.pitchDiff) > 0){
			stats[m].pitch++;
			stats[m].total += 8;
		}

		if(Math.abs(d.attackDiff) > ticksPerQuarterNote/8){
			stats[m].attack++;
			stats[m].total += 1;
		}

		if(Math.abs(d.releaseDiff) > ticksPerQuarterNote/8){
			stats[m].release++;
			stats[m].total += 1;
		}

		if(Math.abs(d.velocityDiff) > 20){
			stats[m].velocity++;
			stats[m].total += 1;
		}
	}

    return Object.values(stats);
}

function createPracticeRanking(diffData){

    const stats =
        createPracticeStats(diffData);

    stats.sort(
        (a,b) => b.total - a.total
    );

    return stats;
	
}

function onMIDISuccess(midiAccess){

    for(let input of midiAccess.inputs.values()){

        input.onmidimessage =
            onMIDIMessage;
    }
}

function canInput(){
    return isRecording;
}

function onMIDIMessage(event){

    if(!canInput()) return;

    inputRouter(event, "midi");

    const [status, data1, data2] = event.data;

    const command = status & 0xf0;
	const channel = status & 0x0f;
	const audioNow =
	    audioContext.currentTime;

    const x_bpm = num("x_bpm");

	const latency = 0.04;

	const t =
	(
		audioNow
		- playbackOffsetTime
		+ latency
	)
	* x_bpm
	* ticksPerQuarterNote
	/ 60;

    // ペダル
    if(command === 0xb0){
		const cc = data1;
        const value = data2;

		console.log(
				"CC",
				data1,
				"value",
				data2
			);

		if(
			cc === 64 ||
			cc === 66 ||
			cc === 67
		){
			if(isRecording){

				pedalData.push({
					channel,
					cc,
					value,
					start: t
				});
			}
		}

		console.log(pedalData);
	}

	// Note On
	if(command === 0x90 && data2 > 0){

		const note = data1;
		const velocity = data2;

		// 音は常に鳴らす
		noteOn(note, velocity);

		// 録音中だけ記録する
		if(isRecording){

			const noteData = {
				channel,
				midi: note,
				start: t,
				stop: null,
				velocity
			};

			recordData.push(noteData);

			const key =
				channel + "_" + note;

			activeNotes[key] = noteData;
		}
	}
	// Note Off
	if(
		command === 0x80 ||
		(
			command === 0x90 &&
			data2 === 0
		)
	){

		const note = data1;

		noteOff(note);

		if(isRecording){

			const key =
				channel + "_" + note;

			if(activeNotes[key]){

				activeNotes[key].stop = t;

				delete activeNotes[key];
			}
		}
	}
}

function noteToFreq(note){

    return 440 *
        Math.pow(
            2,
            (note - 69) / 12
        );
}

function noteOn(note, velocity){

	console.log(status, note, velocity);

    if(oscillators[note]){

        oscillators[note].stop();

        delete oscillators[note];
    }

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "sine";

    osc.frequency.value =
        noteToFreq(note);

    gain.gain.value =
        velocity / 127 * 0.2;

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    oscillators[note] = osc;
}


function noteOff(note){

    const osc = oscillators[note];

    if(!osc) return;

    osc.stop();

    delete oscillators[note];
}

//
// Save Midi
//

function createMidiEvents(noteData, pedalData1=[]){

    const events = [];

    for(const n of noteData){

        events.push({
            tick: Math.round(n.start),
            type: "on",
            channel: n.channel,
            note: n.midi,
            velocity: n.velocity
        });

        if(n.stop != null){

            events.push({
                tick: Math.round(n.stop),
                type: "off",
                channel: n.channel,
                note: n.midi
            });
        }
    }

    for(const p of pedalData1){

        events.push({
            tick: Math.round(p.start),
            type: "cc",
            channel: p.channel,
            cc: p.cc,
            value: p.value
        });
    }

    events.sort(
        (a,b) => a.tick - b.tick
    );

    return events;
}

function writeVLQ(value){

    let buffer = value & 0x7F;
    const bytes = [];

    while((value >>= 7)){

        buffer <<= 8;
        buffer |=
            ((value & 0x7F) | 0x80);
    }

    while(true){

        bytes.push(buffer & 0xFF);

        if(buffer & 0x80){

            buffer >>= 8;

        }else{

            break;
        }
    }

    return bytes;
}

function createTrackData(
    noteData,
    pedalData1=[]
){

    const track = [];

	//Program Change (C0)
	track.push(
		0x00,
		0xC0,
		0x00
	);

    let prevTick = 0;

	const events =
    createMidiEvents(
        noteData,
        pedalData1
    );

    for(const e of events){

        const delta =
            e.tick - prevTick;

        prevTick = e.tick;

        track.push(
            ...writeVLQ(delta)
        );

        if(e.type === "on"){

            track.push(
                0x90 | e.channel,
                e.note,
                e.velocity
            );
        }

        if(e.type === "off"){

            track.push(
                0x80 | e.channel,
                e.note,
                0
            );
        }

        if(e.type === "cc"){

            track.push(
                0xB0 | e.channel,
                e.cc,
                e.value
            );
        }
    }

    // End Of Track
    track.push(
        0x00,
        0xFF,
        0x2F,
        0x00
    );

    return track;
}

function createMetaTrackData(){

    const track = [];

    const mpqn =
        Math.round(
            60000000 / num("x_bpm")
        );

    track.push(
        0x00,
        0xFF,
        0x51,
        0x03,
        (mpqn >> 16) & 255,
        (mpqn >> 8) & 255,
        mpqn & 255
    );

    track.push(
        0x00,
        0xFF,
        0x58,
        0x04,
        beatsPerMeasure,
        Math.round(Math.log2(timeSignatureDenominator)),
        24,
        8
    );

    track.push(
        0x00,
        0xFF,
        0x2F,
        0x00
    );

    return track;
}

function addTrack(
    bytes,
    trackData
){

    const len =
        trackData.length;

    bytes.push(
        0x4d,0x54,0x72,0x6b,
        (len>>24)&255,
        (len>>16)&255,
        (len>>8)&255,
        len&255
    );

    bytes.push(...trackData);
}

function saveMidi(){

	const scoreRight =
		scoreData.filter(
			n =>
				n.track === practiceSettings.handsTrackChannel.right.track &&
				n.channel === practiceSettings.handsTrackChannel.right.channel
		);

	const scoreLeft =
		scoreData.filter(
			n =>
				n.track === practiceSettings.handsTrackChannel.left.track &&
				n.channel === practiceSettings.handsTrackChannel.left.channel
		);
		
    const bytes = [];

    // MThd
    bytes.push(
        0x4d,0x54,0x68,0x64,
        0x00,0x00,0x00,0x06,
        0x00,0x01,
        0x00,0x04,
        (ticksPerQuarterNote>>8)&255,
        ticksPerQuarterNote&255
    );

	addTrack(
		bytes,
		createMetaTrackData()
	);

	addTrack(
		bytes,
		createTrackData(scoreRight)
	);

	addTrack(
		bytes,
		createTrackData(scoreLeft)
	);

	addTrack(
		bytes,
		createTrackData(recordData,pedalData)
	);

	const blob =
        new Blob(
            [new Uint8Array(bytes)],
            {type:"audio/midi"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

const songName =
    val("song1");

	const fileName =
    `${songName}-${getCurrentDateTimeString()}.mid`;

	a.href = url;
    a.download = fileName;	
    a.click();
}

function getCurrentDateTimeString(){

    const now = new Date();

    const y = now.getFullYear();

    const m = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        now.getDate()
    ).padStart(2, "0");

    const h = String(
        now.getHours()
    ).padStart(2, "0");

    const min = String(
        now.getMinutes()
    ).padStart(2, "0");

    const s = String(
        now.getSeconds()
    ).padStart(2, "0");

    return `${y}${m}${d}-${h}${min}${s}`;
}


function getDateTimeString(ms){

    const d = new Date(ms);

    const y = d.getFullYear();

    const m = String(
        d.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        d.getDate()
    ).padStart(2, "0");

    const h = String(
        d.getHours()
    ).padStart(2, "0");

    const min = String(
        d.getMinutes()
    ).padStart(2, "0");

    const s = String(
        d.getSeconds()
    ).padStart(2, "0");

    return `${y}${m}${day}-${h}${min}${s}`;
}

function getDurationTimeString(ms){

    const totalSeconds = Math.floor(ms / 1000);

    const h = Math.floor(totalSeconds / 3600);
    const min = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    return `${String(h).padStart(2,"0")}:${String(min).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function trackChannelInfo(){

	ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.font = "15px Arial";
    ctx.fillStyle = "black";
	
	const infoMap = {};
	
	for(const note of scoreData){

		const key =
			note.track + "_" +
			note.channel;

		if(!infoMap[key]){

			infoMap[key] = {

				track:
					note.track,

				channel:
					note.channel,

				sum: 0,

				count: 0
			};
		}

		infoMap[key].sum +=
			note.midi;

		infoMap[key].count++;
	}

		const rows =
		Object.values(infoMap);

	rows.forEach(row => {

		row.avg =
			row.sum /
			row.count;
	});
	
	const channelInstrument = {};

	rawMidi.tracks.forEach(track => {

		track.forEach(event => {

			if(event.type === "programChange"){

				channelInstrument[
					event.channel
				] =
					event.programNumber;
			}

		});

	});

	console.log(channelInstrument);

	rows.forEach(row => {

		const instNumber =
			channelInstrument[row.channel];

		row.instrument =
			instName[instNumber] || "-";

	});
	ctx.fillText("Color",100,50);
	ctx.fillText("Hand",160,50);
	ctx.fillText("Track",280,50);
	ctx.fillText("Channel",360,50);
	ctx.fillText("Notes",460,50);
	ctx.fillText("Avg MIDI",540,50);
	ctx.fillText("Instrument",660,50);

		rows.forEach((row,i)=>{

		const y =
			30*(i+1)+50;

		let handColor =
			workingColor.hand[
				HAND_COLOR.SCORE_NOT_ASSIGNED
			];
		let handName = HANDS_LABEL[HANDS.OTHER];;

		if(row.track == practiceSettings.handsTrackChannel.right.track && 
		row.channel == practiceSettings.handsTrackChannel.right.channel){
			handColor =
				workingColor.hand[
					HAND_COLOR.SCORE_RIGHT
				];
			handName = HANDS_LABEL[HANDS.RIGHT];
		}
		else if(row.track == practiceSettings.handsTrackChannel.left.track && 
		row.channel == practiceSettings.handsTrackChannel.left.channel){
			handColor =
				workingColor.hand[
					HAND_COLOR.SCORE_LEFT
				];
			handName = HANDS_LABEL[HANDS.LEFT];
		}
		
		ctx.fillStyle = handColor;

		ctx.beginPath();
		ctx.arc(
			110,
			y-5,
			10,
			0,
			2*Math.PI
		);

		ctx.fill();

		ctx.fillStyle =
			"black";

		ctx.fillText(
			handName,
			160,
			y
		);

		ctx.fillText(
				row.track,
				280,
				y
			);

		ctx.fillText(
			row.channel,
			360,
			y
		);

		ctx.fillText(
			row.count,
			460,
			y
		);

		ctx.fillText(
			row.avg.toFixed(1),
			540,
			y
		);

		ctx.fillText(
			row.instrument,
			660,
			y
		);

	});
}

function keyEstimation(){
canvas.width = 1300;
canvas.height = 3000;

let measurePc = [];

for (const note of scoreData) {

    const measure = Math.floor(note.start / ticksPerMeasure);
    const pc = note.midi % 12;

    if (!measurePc[measure]) {
        measurePc[measure] = {
            pc: new Array(12).fill(0),
            count: 0
        };
    }

    measurePc[measure].pc[pc]++;
    measurePc[measure].count++;

}

let lastStart = 0;

for (const note of scoreData) {

    if (note.start > lastStart) {
        lastStart = note.start;
    }
}

const mscnt = Math.floor(lastStart / ticksPerMeasure) + 1;

ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.font="10px Arial";
ctx.lineWidth=1;
ctx.fillStyle="black";
ctx.fillText("Proportions of pitch classes in time windows and scatter plot of pitch classes and time",100,10);
ctx.fillText("Note #",50,20);
ctx.fillText("Note b",50,30);
ctx.fillText("Count",50,40);
ctx.fillText("Measure",0,40);
ctx.fillText("Estimated Key",700,40);

for(let i=0; i<mscnt; i++){
	if (i+1>=10){
		ctx.fillText(i+1, 0, 50+i*10);
	}else{	
		ctx.fillText(i+1, 5, 50+i*10);
	}
}

for(let k=0;k<=11;k++){
	ctx.fillStyle="black";
	ctx.fillText(engs1[k],100+50*k,20);
	ctx.fillText(engf1[k],100+50*k,30);
	ctx.fillText((k%12).toString(12),100+50*k,40);
}

for (const note of scoreData) {

	const y = Math.floor(40 + note.start / ticksPerMeasure * 10);
    const pc = note.midi % 12;
	ctx.fillStyle=workingColor.pc[pc];
	ctx.fillRect(100 + Number(pc * 50), y, 50, 1);

}

ctx.fillStyle="black";
ctx.fillText("Proportions of keys and the best relative keys in time windows",100,60+mscnt*10);
ctx.fillText("Major",50,70+mscnt*10);
ctx.fillText("Minor",50,80+mscnt*10);
ctx.fillText("Measure",0,90+mscnt*10);
ctx.fillText("Count",50,90+mscnt*10);
ctx.fillText("Estimated Key",700,90+mscnt*10);

for (let i=0; i<mscnt; i++){
	if (i+1>=10){
		ctx.fillText(i+1,0,100+mscnt*10+i*10);
	}else{	
		ctx.fillText(i+1,5,100+mscnt*10+i*10);
	}
}

for(let k=0;k<=11;k++){
	ctx.fillStyle="black";
	ctx.fillText(engf1[k],100+50*k,70+mscnt*10);
	ctx.fillText(engMnr1[(k+9)%12],100+50*k,80+mscnt*10);
}

for (let i = 0; i < mscnt; i++) {

    if (!measurePc[i] || measurePc[i].count === 0) {
        continue;
    }

    for (let j = 0; j < 12; j++) {
	
        const w0 = measurePc[i].pc[j] / measurePc[i].count * 100;

        if (w0 == 100) {
            ctx.fillText(w0.toFixed(2), 100 + 50 * j, 50 + 10 * i);
        } else if (w0 >= 10) {
            ctx.fillText(w0.toFixed(2), 105 + 50 * j, 50 + 10 * i);
        } else {
            ctx.fillText(w0.toFixed(2), 110 + 50 * j, 50 + 10 * i);

	}else {
