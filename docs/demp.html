<style>

}

.fingerTable{

}

.fingerTable td,

    padding:2px 4px;
}

.noteMenu{
    position:absolute;
    display:none;
    background:white;
    border:1px solid #888;
    border-radius:8px;
    padding:4px;
}

.noteMenu button{
    width:40px;
    height:40px;
    font-size:20px;
}

#textPage input.category1,
#textPage input.category2,
#textPage input.item {
    color: black;
    background-color: white;
    border: 1px solid black;
}

.window{

    position:absolute;

    left:50px;
    top:10px;

    width:350px;
    height:250px;

    background:white;

    border:1px solid gray;

    border-radius:8px;

    box-shadow:0 4px 10px gray;

    display:none;

    z-index:1000;

}

.windowHeader{

    height:36px;

    background:#ddd;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:5px;

    cursor:move;

    user-select:none;

}

#menuBody{

    padding:10px;

}

#canvasContainer{

    position:relative;

}


#canvas{

    display:block;

}


#mainPage{
    position:relative;
}

#menuButton{

    position:absolute;

    left:5px;
    top:5px;

    font-size:14px;

    z-index:1000;

}
#htmlPage{
    position:fixed;
    left:20;
    top:20;
    width:100vw;
    height:100vh;
    background:white;
    overflow:auto;
}
.hiddenControl {
    display:none;
}

//========================================

function $(id) {
    return document.getElementById(id);
}

function val(id) {
    return $(id).value;
}

function num(id) {
    return Number($(id).value);
}

function chk(id) {
    return $(id).checked;
}

function setVal(id, value) {
    $(id).value = value;
}


//========================================
// UI Array Value
//========================================


function readArrayUi(array, prefix) {

    for (let i = 0; i < array.length; i++) {
        array[i] = val(prefix + i);
    }
}

function writeArrayUi(array, prefix) {

    for (let i = 0; i < array.length; i++) {
        setVal(prefix + i, array[i]);
    }
}


function readObjUi(obj, prefix) {

    for (const key in obj) {
        obj[key] = val(prefix + key);
    }

}

function writeObjUi(obj, prefix) {

    for (const key in obj) {
        setVal(prefix + key, obj[key]);
    }

}

    return (tick / ticksPerQuarterNote) * 60 / bpm;
}


function getCurrentTick(){

    const x_bpm = num("x_bpm");
	const now =
    audioContext.currentTime;

    return (
		now
        -
        playbackOffsetTime
    ) *
    x_bpm *
    ticksPerQuarterNote / 60;
}

}

let ticksPerSecond = 0;

    RECORD: 3
});

function initializeScoreSystem(){

	rawMidi =
		parseMidi(midiData);

	const scoreAll = createScoreDataFromTracks(rawMidi);

	const recordDataLocal = scoreAll.filter(n => n.track === TRACK.RECORD);
	const scoreMain  = scoreAll.filter(n => n.track !== TRACK.RECORD);

	recordData = recordDataLocal;
	scoreData  = scoreMain;

	const tempoTrackData = createTempoTrack(rawMidi);
	const beatTrackData  = createBeatTrack(rawMidi);

	songFirstBpm =getTempo(tempoTrackData);
	
	const ts = getTimeSignature(beatTrackData);

	beatsPerMeasure = ts.beats;
	timeSignatureDenominator = ts.denom;

	ticksPerQuarterNote = getTicksPerQuarterNote(rawMidi);

	songLengthTicks = getSongLength();

	ticksPerMeasure = calcTicksPerMeasure(
		ticksPerQuarterNote,
		beatsPerMeasure,
		timeSignatureDenominator
	);

	hands = splitHands(scoreMain);

	scoreRight = hands.right;
	scoreLeft  = hands.left;
		
	const range = resolveMidiRange({
		main: scoreMain,
		right: scoreRight,
		left: scoreLeft
	});
	midi_min = range.min;
	midi_max = range.max;

}

function getTicksPerQuarterNote(midi) {
    return midi.header.ticksPerBeat;
}


function getTempo(tempoTrackData) {
    return tempoTrackData.length > 0
        ? tempoTrackData[0].value
        : 60;
}

function getTimeSignature(beatTrackData) {
    return beatTrackData.length > 0
        ? {
            beats: beatTrackData[0].value[0],
            denom: beatTrackData[0].value[1]
        }
        : { beats: 4, denom: 4 };
}

function splitHands(scoreMain) {
	return {
		right: scoreMain.filter(n =>
			n.track === practiceSettings.handsTrackChannel.right.track &&
			n.channel === practiceSettings.handsTrackChannel.right.channel
		),
		left: scoreMain.filter(n =>
			n.track === practiceSettings.handsTrackChannel.left.track &&
			n.channel === practiceSettings.handsTrackChannel.left.channel
		)
	};
}

function calcTicksPerMeasure(
    ticksPerQuarterNote,
    beatsPerMeasure,
    timeSignatureDenominator
) {
    return ticksPerQuarterNote *
           4 *
           beatsPerMeasure /
           timeSignatureDenominator;
}


function getMidiRange(notes) {
    let min = Infinity;
    let max = -Infinity;

    for (const n of notes) {
        if (n.midi < min) min = n.midi;
        if (n.midi > max) max = n.midi;
    }

    return { min: min === Infinity ? 0 : min, max: max === -Infinity ? 0 : max };
}

function resolveMidiRange(data){

    switch (practiceSettings.hands) {

        case HANDS.BOTH:
            return getMidiRange(data.main);

        case HANDS.RIGHT:
            return getMidiRange(data.right);

        case HANDS.LEFT:
            return getMidiRange(data.left);
    }

    return {min:0,max:0};
}

// score data

function createScoreDataFromTracks(rawMidi){

    const scoreData = [];

	let n_id = 1;

    rawMidi.tracks.forEach(
        (track, trackNo) => {

            if(trackNo === 0){
                return;
            }

            let tick = 0;

            const activeNotes = {};

            track.forEach(event => {

                tick += event.deltaTime;

                if(
                    event.type === "noteOn"
                    &&
                    event.velocity > 0
                ){

                    const key =
                        event.channel +
                        "_" +
                        event.noteNumber;

                    activeNotes[key] = {

                        start: tick,
                        velocity:
                            event.velocity
                    };
                }

                if(
                    event.type === "noteOff"
                    ||
                    (
                        event.type === "noteOn"
                        &&
                        event.velocity === 0
                    )
                ){

                    const key =
                        event.channel +
                        "_" +
                        event.noteNumber;

                    const note =
                        activeNotes[key];

                    if(note){

                        scoreData.push({

                            midi:
                                event.noteNumber,

                            start:
                                note.start,

                            stop:
                                tick,

                            velocity:
                                note.velocity,

                            channel:
                                event.channel,

                            track:
                                trackNo,

							n_id: 
								n_id++

                        });

						delete activeNotes[key];
                    }
                }
            });
        }
		
    );

	scoreData.sort(
		(a,b)=>a.start-b.start
	);

    return scoreData;
}


function createTempoTrack(){

	const tempoTrack = [];

	let tick = 0;

	rawMidi.tracks[0].forEach(event=>{

		tick += event.deltaTime;

		if(event.type === "setTempo"){

			tempoTrack.push({

				timing: tick,

				value:
					Math.round(
						60000000
						/
						event.microsecondsPerBeat
					)
			});
		}
	});

	return tempoTrack;

}

function createBeatTrack(){

	const beatTrack = [];

	let tick = 0;

	rawMidi.tracks[0].forEach(event=>{

		tick += event.deltaTime;

		if(event.type === "timeSignature"){

			beatTrack.push({

				timing: tick,

				value:[
					event.numerator,
					event.denominator
				]
			});
		}
	});

	return beatTrack;

}

function getSongLength(){

    let maxTick = 0;

    rawMidi.tracks.forEach(track => {

        let tick = 0;

        track.forEach(event => {

            tick += event.deltaTime;
        });

        if(tick > maxTick){

            maxTick = tick;
        }
    });

    return maxTick;
}

function setTsv(data2){

    tsv = {
        raw: "",
        a: [],
        sc: [],
        ff: [],
        ft: [],
        sd: [],
        dl: [],
        t1: [],
        t2: [],
        t3: [],
        t4: [],
        t5: [],
        t6: [],
        t7: [],
        t8: [],
        t9: []
    };

    // ★ TSVが無い場合は空で終了
    if(!data2){
        console.log("TSV is empty (local file or missing)");
        return;
    }

    tsv.raw = data2;

	console.log("=== TSV DEBUG START ===");
	console.log(data2);
	console.log("length:", data2?.length);

	const lines = data2?.split("\n") || [];

	console.log("lines:", lines.length);
	console.log("first line:", lines[0]);
	console.log("first cols:", lines[0]?.split("\t"));

	console.log("=== TSV DEBUG END ===");

//    const lines = data2.split('\n');

    lines.forEach(line => {
        const cols = line.split('\t');
        const type = cols[0];

        if(type === "A"){
            tsv.a.push([cols[1], cols[2]]);
        }else if(type === "B"){
            tsv.sc.push([cols[2]]);
        }else if(type === "C"){
            tsv.ff.push([cols[1], cols[2]]);
            tsv.ft.push([cols[2], cols[1]]);
            tsv.sd.push([cols[3], -cols[3]]);
            tsv.dl.push([cols[4], cols[4]]);
        }else if(type === "D"){
            tsv.t1.push([cols[2]]);
            tsv.t2.push([cols[3]]);
            tsv.t3.push([cols[4]]);
            tsv.t4.push([cols[5]]);
            tsv.t5.push([cols[6]]);
            tsv.t6.push([cols[7]]);
            tsv.t7.push([cols[8]]);
            tsv.t8.push([cols[9]]);
            tsv.t9.push([cols[10]]);
        }
    });
}

function readFileAsArrayBuffer(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
    });
}

function readFileAsText(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsText(file);
    });
}

function assignHands(
    recordData,
    scoreRight,
    scoreLeft
){
    const right = [];
    const left = [];

    for(const r of recordData){

        let rightCost = Infinity;
        let leftCost = Infinity;

        for(const s of scoreRight){
			const rLen = r.stop - r.start;
			const sLen = s.stop - s.start;
			const cost =
				Math.abs(r.midi - s.midi)
				+
				Math.abs(r.start - s.start) / 100
				+
				Math.abs(rLen - sLen) / 100;

            rightCost =
                Math.min(
                    rightCost,
                    cost
                );
        }

        for(const s of scoreLeft){
			const rLen = r.stop - r.start;
			const sLen = s.stop - s.start;
			const cost =
				Math.abs(r.midi - s.midi)
				+
				Math.abs(r.start - s.start) / 100
				+
				Math.abs(rLen - sLen) / 100;

            leftCost =
                Math.min(
                    leftCost,
                    cost
                );
        }

	if(rightCost <= leftCost){

		right.push(r);

	}else{

		left.push(r);
	}    }

    return {
        right,
        left
    };
}

function createVoice(midi) {

    const ctx = audioContext;

    const freq = midiToFreq(midi);

    const gain = ctx.createGain();
    gain.connect(ctx.destination);

    const osc1 = ctx.createOscillator();
    osc1.frequency.value = freq;

    const osc2 = ctx.createOscillator();
    osc2.frequency.value = freq;

    const osc3 = ctx.createOscillator();
    osc3.frequency.value = freq;

    const detune = 0.3 + (midi - 21) * 0.01;

    const pan1 = ctx.createStereoPanner();
    const pan2 = ctx.createStereoPanner();
    const pan3 = ctx.createStereoPanner();

    const keyboardPan = Math.max(-1,
        Math.min(1, (midi - 64) / 44));

    pan1.pan.value = Math.max(-1, Math.min(1, keyboardPan - 0.1));
    pan2.pan.value = Math.max(-1, Math.min(1, keyboardPan));
    pan3.pan.value = Math.max(-1, Math.min(1, keyboardPan + 0.1));

    if (midi < 48) {
        osc1.type = "triangle";
        osc2.type = "triangle";
        osc3.type = "triangle";
    } else {
        osc1.type = "sawtooth";
        osc2.type = "triangle";
        osc3.type = "sawtooth";
    }

    osc1.detune.value = -detune;
    osc2.detune.value = 0;
    osc3.detune.value = detune;

    const gain1 = ctx.createGain();
    gain1.gain.value = 0.2;

    const gain2 = ctx.createGain();
    gain2.gain.value = 0.6;

    const gain3 = ctx.createGain();
    gain3.gain.value = 0.2;

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value =
        Math.min(5000, freq * 4);
    filter.Q.value = 0.7;

    osc1.connect(gain1);
    osc2.connect(gain2);
    osc3.connect(gain3);

    gain1.connect(pan1);
    gain2.connect(pan2);
    gain3.connect(pan3);

    pan1.connect(filter);
    pan2.connect(filter);
    pan3.connect(filter);

    filter.connect(gain);
    const voice = {
        osc1,
        osc2,
        osc3,
        gain,
        gain1,
        gain2,
        gain3,
        pan1,
        pan2,
        pan3,
        filter,
        freq,
        detune
    };

    return voice;

}

function startVoice(voice, when) {

    voice.osc1.detune.setValueAtTime(-voice.detune, when);
    voice.osc1.detune.linearRampToValueAtTime(-voice.detune * 0.3, when + 0.5);

    voice.osc3.detune.setValueAtTime( voice.detune, when);
    voice.osc3.detune.linearRampToValueAtTime( voice.detune * 0.3, when + 0.5);

    voice.gain.gain.setValueAtTime(0.0001, when);
    voice.gain.gain.exponentialRampToValueAtTime(0.15, when + 0.003);

    const cutoff = voice.freq * 3;

    voice.filter.frequency.setValueAtTime(cutoff, when);
    voice.filter.frequency.exponentialRampToValueAtTime(
        cutoff * 0.5,
        when + 0.3
    );

    voice.osc1.start(when);
    voice.osc2.start(when);
    voice.osc3.start(when);
}

function playNoteNow(midi){

    const when = audioContext.currentTime;

    const voice = createVoice(midi);
    activeVoices.set(midi, voice);

    startVoice(voice, when);

    return when;
}

function stopNoteNow(midi){

function stopVoice(midi){

    const voice =
        activeVoices.get(midi);

    if(!voice){
        return;
    }

	const now =
		audioContext.currentTime;

    voice.gain.gain.cancelScheduledValues(now);
    voice.gain.gain.setValueAtTime(
        voice.gain.gain.value,
        now
    );
    voice.gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.05
    );
        voice.osc1.stop(now + 0.05);
        voice.osc2.stop(now + 0.05);
        voice.osc3.stop(now + 0.05);

    setTimeout(() => {

        voice.osc1.disconnect();
        voice.osc2.disconnect();
        voice.osc3.disconnect();

        voice.gain1.disconnect();
        voice.gain2.disconnect();
        voice.gain3.disconnect();

        voice.pan1.disconnect();
        voice.pan2.disconnect();
        voice.pan3.disconnect();

        voice.filter.disconnect();
        voice.gain.disconnect();

    }, 100);

    activeVoices.delete(midi);

}

        }
    });

    currentMidis.clear();
}

function stopPlayback() {

    isPlaying = false;

function loopPlayback(){

    if (!isPlaying) return;

    const tick = getCurrentTick();

    if (tick >= songLengthTicks) {

        if (isRecording) {
            stopRecording();
        } else {
            stopPlayback();
        }

        return;
    }

    setVal("x_targetMeasure", Math.floor(tick / ticksPerMeasure) + 1);

    renderPlayBack(tick);

    if (enablePlaybackSound){
        scheduleNotes(noteData, tick);
    }

    rafId = requestAnimationFrame(loopPlayback);
}

function initPlayback() {

    const ctx = audioContext;

    playbackOffsetTime =
        ctx.currentTime -
        tickToSec(pauseTick);

    prevTick = pauseTick;
    nextIndex = -1;

}

function setPlaybackTarget(renderer, data) {
    renderPlayBack = renderer;
    noteData = data;
}

function playNote(midi, durationTick, startTick) {

    const voice = createVoice(midi);

    const startTime =
        playbackOffsetTime + tickToSec(startTick);

    const duration =
        tickToSec(durationTick);

    startVoice(voice, startTime);
    stopVoiceLater(voice, startTime, duration);

}


function stopVoiceLater(voice, startTime, duration) {

    const stopTime = startTime + duration;

    voice.gain.gain.setValueAtTime(0.15, stopTime);
    voice.gain.gain.exponentialRampToValueAtTime(
        0.0001,
        stopTime + 0.05
    );

    voice.osc1.stop(stopTime + 0.05);
    voice.osc2.stop(stopTime + 0.05);
    voice.osc3.stop(stopTime + 0.05);
}

function scheduleNotes(dataArray, tick){

	const data0 = dataArray;

    // 最初だけ検索
    if (nextIndex < 0){

        nextIndex = 0;

        while (
            nextIndex < data0.length &&
            data0[nextIndex].start < prevTick
        ){
            nextIndex++;
        }
    }

    const x_bpm = num("x_bpm");

    const currentTick  = Math.floor(tick);
    const previousTick = Math.floor(prevTick);

    const lookAheadTicks =
        0.1 * x_bpm * ticksPerQuarterNote / 60;

    while (nextIndex < data0.length){

        const data = data0[nextIndex];

        if (data.start > currentTick + lookAheadTicks){
            break;
        }

        if (
            data.stop != null &&
            data.start >= previousTick &&
            data.start <= currentTick + lookAheadTicks
        ){

            playNote(
                data.midi,
                Math.max(1, data.stop - data.start),
                data.start
            );
        }

        nextIndex++;
    }

    prevTick = tick;
}


function midiToFreq(midi){

    return 440 * Math.pow(
        2,
        (midi - 69) / 12
    );
}

function drawTriangle(ctx, cx, cy, s){

	ctx.beginPath();

	ctx.moveTo(
		cx,
		cy - s * (Math.sqrt(3) * 2 / 3)
	);

	ctx.lineTo(
		cx - s,
		cy + s * (Math.sqrt(3) * 1 / 3)
	);

	ctx.lineTo(
		cx + s,
		cy + s * (Math.sqrt(3) * 1 / 3)
	);

	ctx.closePath();
	ctx.stroke();
}

function drawStar(ctx, cx, cy, r){
	ctx.lineJoin = "round";
	ctx.lineCap  = "round";
    const p = [];

    for(let i = 0; i < 5; i++){

        const a = (-90 + i * 72) * Math.PI / 180;

        p.push({
            x: cx + r * Math.cos(a),
            y: cy + r * Math.sin(a)
        });

    }

    const order = [0, 2, 4, 1, 3, 0];

    ctx.beginPath();

    ctx.moveTo(p[0].x, p[0].y);

    for(let i = 1; i < order.length; i++){

        ctx.lineTo(
            p[order[i]].x,
            p[order[i]].y
        );

    }

	ctx.closePath();
    ctx.stroke();

}


function drawHeart(ctx, cx, cy, s){

    ctx.beginPath();

	ctx.moveTo(cx, cy + s * 0.5);

	ctx.bezierCurveTo(
		cx - s * 0.8, cy + s * 0.2,
		cx - s * 0.8, cy - s * 0.8,
		cx,           cy - s * 0.5
	);

	ctx.bezierCurveTo(
		cx + s * 0.8, cy - s * 0.8,
		cx + s * 0.8, cy + s * 0.2,
		cx,           cy + s * 0.5
	);
    ctx.closePath();

    ctx.stroke();
//  ctx.fill();
}

function drawDiamond(ctx, cx, cy, s){

    ctx.beginPath();

    ctx.moveTo(cx,     cy - s); // 上
    ctx.lineTo(cx + s, cy);     // 右
    ctx.lineTo(cx,     cy + s); // 下
    ctx.lineTo(cx - s, cy);     // 左

    ctx.closePath();

    ctx.stroke();
//  ctx.fill();

}

        shapeEventDataLeft,
        ticksPerMeasure
    );

}


function createShapeEvent(scoreNotes, hand){

    console.log(
        "createShapeEvent:",
        hand,
        "scoreNotes =",
        scoreNotes
    );

    const shapeEventData = {};

    if(!Array.isArray(scoreNotes)){
        console.warn(
            "createShapeEvent: scoreNotes is not an array",
            scoreNotes
        );
        return shapeEventData;
    }

    const notes = [...scoreNotes].sort(
        (a, b) => a.start - b.start
    );

    if(notes.length === 0){
        return shapeEventData;
    }

    // -----------------------------------------
    // 同じstartの音を音イベントとしてまとめる
    // -----------------------------------------

    const events = [];

    for(const note of notes){

        let event =
            events[events.length - 1];

        if(
            !event ||
            event.start !== note.start
        ){

            event = {
                start: note.start,
                notes: []
            };

            events.push(event);
        }

        event.notes.push(note);
    }

    // -----------------------------------------
    // 音イベントごとにshapeを作る
    // -----------------------------------------

    for(let i = 0; i < events.length; i++){

        const event = events[i];

        // このeventに含まれるPitch Class
        const pitchClasses =
            event.notes
            .map(note =>
                ((note.midi % 12) + 12) % 12
            )
            .sort((a, b) => a - b);

        shapeEventData[i] = {

            event: i,

            start: event.start,

            hand: hand,

            // 単音なら数値
            // 和音なら配列
            pitchClass:
                pitchClasses.length === 1
                    ? pitchClasses[0]
                    : pitchClasses,

            points:
                event.notes.map(note => ({

                    start: note.start,

                    midi: note.midi,

                    pitchClass:
                        ((note.midi % 12) + 12) % 12
                }))
        };
    }

    return shapeEventData;
}


function findInternalMotifs(data, hand){

    const candidates =
        findMotifEvent(
            data,
            data
        );

    const motifs =
        groupInternalMotifs(
            data,
            candidates,
            hand
        );

    const filtered =
        filterInternalMotifs(
            motifs
        );

    return filtered;
}


function findMotifEvent(
    shapeEventDataA,
    shapeEventDataB
){

    const eventsA =
        Object.keys(shapeEventDataA)
            .map(Number)
            .sort((a,b) => a-b);

    const eventsB =
        Object.keys(shapeEventDataB)
            .map(Number)
            .sort((a,b) => a-b);

    const candidates = [];

    // A の開始位置
    for(let i = 0; i < eventsA.length; i++){

        // B の開始位置
        for(let j = 0; j < eventsB.length; j++){


            // 12種類の移調をすべて試す
            for(let transpose = 0; transpose < 12; transpose++){

                let length = 0;


                while(
                    i + length < eventsA.length &&
                    j + length < eventsB.length
                ){

                    const ea =
                        shapeEventDataA[
                            eventsA[i + length]
                        ];

                    const eb =
                        shapeEventDataB[
                            eventsB[j + length]
                        ];


                    const pa =
                        ea.points.map(
                            p => p.pitchClass
                        );

                    const pb =
                        eb.points.map(
                            p => p.pitchClass
                        );


                    // 現時点では1 event = 1音だけ
                    if(
                        pa.length !== 1 ||
                        pb.length !== 1
                    ){
                        break;
                    }


                    const expected =
                        (pb[0] + transpose) % 12;


                    if(pa[0] !== expected){
                        break;
                    }


                    length++;
                }


                if(length >= MIN_LENGTH){

                    candidates.push({

                        startA:
                            eventsA[i],

                        startB:
                            eventsB[j],

                        length,

                        transpose
                    });

                }

            }

        }

    }


    return candidates;
}


function findCommonInternalMotifs(
    dataRight,
    dataLeft
){

    const candidates =
        findMotifEvent(
            dataRight,
            dataLeft
        );


    const result = [];


    for(const candidate of candidates){

        const patternRight =
            getNormalizedPattern(
                dataRight,
                candidate.startA,
                candidate.length
            );

        const patternLeft =
            getNormalizedPattern(
                dataLeft,
                candidate.startB,
                candidate.length
            );


        if(
            !patternRight ||
            !patternLeft
        ){
            continue;
        }


        if(
            patternRight.length !==
            patternLeft.length
        ){
            continue;
        }


        let same = true;


        for(
            let i = 0;
            i < patternRight.length;
            i++
        ){

            if(
                patternRight[i] !==
                patternLeft[i]
            ){

                same = false;
                break;

            }

        }


        if(!same){
            continue;
        }


        result.push({

            length:
                candidate.length,

            pattern:
                [...patternRight],

            right: {

                start:
                    candidate.startA,

                transpose:
                    candidate.transpose

            },

            left: {

                start:
                    candidate.startB,

                transpose:
                    candidate.transpose

            }

        });

    }


    return result;
}


function groupInternalMotifs(data, candidates){

    const motifMap = {};

    for(const candidate of candidates){

        const pattern =
            getMotifPattern(
                data,
                candidate.startA,
                candidate.length
            );

        if(!pattern){
            continue;
        }

        const normalized =
            normalizeMotifPattern(pattern);

        if(!normalized){
            continue;
        }

        const key =
            candidate.length +
            ":" +
            JSON.stringify(normalized);


        if(!motifMap[key]){

            motifMap[key] = {

                length:
                    candidate.length,

                pattern:
                    normalized,

                positions:
                    new Set(),

                occurrences:
                    []

            };

        }


        const motif =
            motifMap[key];


        // =================================
        // 1回目の出現
        // =================================

        motif.positions.add(
            candidate.startA
        );

        motif.occurrences.push({

            start:
                candidate.startA,

            transpose:
                candidate.transpose

        });


        // =================================
        // 2回目の出現
        // =================================

        motif.positions.add(
            candidate.startB
        );

        motif.occurrences.push({

            start:
                candidate.startB,

            transpose:
                candidate.transpose

        });

    }


    const result = [];


    for(
        const motif
        of Object.values(motifMap)
    ){

        // =================================
        // 同じstartを重複削除
        // =================================

        const unique =
            new Map();


        for(
            const occurrence
            of motif.occurrences
        ){

            if(
                !unique.has(
                    occurrence.start
                )
            ){

                unique.set(
                    occurrence.start,
                    {
                        start:
                            occurrence.start,

                        transpose:
                            occurrence.transpose
                    }
                );

            }

        }


        const occurrences =
            [...unique.values()].sort(
                (a,b) =>
                    a.start - b.start
            );


        // =================================
        // 2回以上出現するものだけ
        // =================================

        if(
            occurrences.length >= 2
        ){

            result.push({

                length:
                    motif.length,

                pattern:
                    motif.pattern,

                positions:
                    [...motif.positions].sort(
                        (a,b) => a-b
                    ),

                occurrences:
                    occurrences

            });

        }

    }


    return result;
}


function getMotifPattern(data, start, length){

    const events =
        Object.values(data);

    const pattern = [];

    for(let i = 0; i < length; i++){

        const event =
            events[start + i];

        if(
            !event ||
            !event.points ||
            event.points.length !== 1 ||
            event.points[0].pitchClass === undefined
        ){
            return null;
        }

        pattern.push(
            event.points[0].pitchClass
        );
    }

    return pattern;
}


function getNormalizedPattern(
    shapeEventData,
    start,
    length
){

    const events =
        Object.keys(shapeEventData)
            .map(Number)
            .sort((a,b) => a-b);

    const pattern = [];

    for(let i = 0; i < length; i++){

        const event =
            shapeEventData[
                events[start + i]
            ];

        if(
            !event ||
            !event.points ||
            !event.points.length
        ){
            return null;
        }

        const pc =
            event.points[0].pitchClass;

        if(
            pc === undefined ||
            pc < 0 ||
            pc > 11
        ){
            return null;
        }

        pattern.push(pc);
    }

    if(!pattern.length){
        return null;
    }

    // 最初の音を0として正規化
    const base = pattern[0];

    return pattern.map(
        pc => (pc - base + 12) % 12
    );
}


function normalizeMotifPattern(pattern){

    if(
        !pattern ||
        !pattern.length
    ){
        return null;
    }

    const base = pattern[0];

    return pattern.map(
        pc => (pc - base + 12) % 12
    );
}

function filterInternalMotifs(motifs){

    const sorted =
        [...motifs].sort(
            (a,b) => b.length - a.length
        );

    const result = [];


    for(const motif of sorted){

        let contained = false;


        for(const longer of result){

            if(longer.length <= motif.length){
                continue;
            }


            // =================================
            // 出現数が同じか確認
            // =================================

            if(
                motif.positions.length !==
                longer.positions.length
            ){
                continue;
            }


            // =================================
            // 各出現位置について
            // 長いMotifの中に含まれるか
            // =================================

            const allContained =
                motif.positions.every(
                    (position, index) => {

                        const longPosition =
                            longer.positions[index];


                        return (
                            position >=
                                longPosition &&

                            position + motif.length <=
                                longPosition +
                                longer.length
                        );

                    }
                );


            if(allContained){

                contained = true;
                break;

            }

        }


        if(!contained){

            result.push(motif);

        }

    }


    return result;

}


function mergeInternalMotifs(
    internalRight,
    internalLeft,
    internalCommon
){

    const motifMap = new Map();


    // =====================================
    // 右手・左手それぞれのInternal Motif
    // =====================================

    const sources = [

        {
            hand: "R",
            motifs: internalRight
        },

        {
            hand: "L",
            motifs: internalLeft
        }

    ];


    for(const source of sources){

        for(const motif of source.motifs){

            const key =
                motif.length +
                ":" +
                JSON.stringify(
                    motif.pattern
                );


            if(!motifMap.has(key)){

                motifMap.set(
                    key,
                    {

                        length:
                            motif.length,

                        pattern:
                            [...motif.pattern],

                        R: [],
                        L: []

                    }
                );

            }


            const group =
                motifMap.get(key);


            for(
                const start
                of motif.positions
            ){

                group[source.hand].push({

                    start:
                        start

                });

            }

        }

    }


    // =====================================
    // 右手 × 左手の共通Motif
    // =====================================

    for(
        const motif
        of internalCommon
    ){

        const key =
            motif.length +
            ":" +
            JSON.stringify(
                motif.pattern
            );


        if(!motifMap.has(key)){

            motifMap.set(
                key,
                {

                    length:
                        motif.length,

                    pattern:
                        [...motif.pattern],

                    R: [],
                    L: []

                }
            );

        }


        const group =
            motifMap.get(key);


        group.R.push(
            motif.right
        );


        group.L.push(
            motif.left
        );

    }


    // =====================================
    // 配列化
    // =====================================

    const result =
        Array.from(
            motifMap.values()
        );


    // =====================================
    // 出現位置の重複削除
    // =====================================

    for(const motif of result){

        for(
            const hand of ["R", "L"]
        ){

            const unique =
                new Map();


            for(
                const occurrence
                of motif[hand]
            ){

                if(
                    !unique.has(
                        occurrence.start
                    )
                ){

                    unique.set(
                        occurrence.start,
                        occurrence
                    );

                }

            }


            motif[hand] =
                [...unique.values()].sort(
                    (a,b) =>
                        a.start - b.start
                );

        }

    }


    // =====================================
    // 長いMotifを先に
    // =====================================

    result.sort(
        (a,b) =>
            b.length - a.length
    );


    // =====================================
    // 上位10件
    // =====================================

    const filtered =
        filterMergedInternalMotifs(
            result
        );

    const top =
        filtered.slice(0, 10);

    // =====================================
    // Motif ID
    // =====================================

    top.forEach(
        (motif, index) => {

            motif.motifId =
                index + 1;

        }
    );


    return top;
}


function filterMergedInternalMotifs(motifs){

    const sorted =
        [...motifs].sort(
            (a,b) =>
                b.length - a.length
        );


    const result = [];


    for(const motif of sorted){

        let contained = false;


        for(const longer of result){

            if(
                longer.length <=
                motif.length
            ){
                continue;
            }


            // =================================
            // R / L それぞれについて確認
            // =================================

            const hands = ["R", "L"];

            let allContained = true;


            for(const hand of hands){

                const shortOccurrences =
                    motif[hand] || [];

                const longOccurrences =
                    longer[hand] || [];


                // ---------------------------------
                // 短いMotifがこの手に存在する場合
                // ---------------------------------

                if(
                    shortOccurrences.length === 0
                ){
                    continue;
                }


                // 長いMotifの同じ手に
                // 対応する出現が必要
                if(
                    longOccurrences.length === 0
                ){

                    allContained = false;
                    break;

                }


                // ---------------------------------
                // 各短いMotifの出現位置を確認
                // ---------------------------------

                for(
                    const shortOccurrence
                    of shortOccurrences
                ){

                    const shortStart =
                        shortOccurrence.start;


                    const isContained =
                        longOccurrences.some(
                            longOccurrence => {

                                const longStart =
                                    longOccurrence.start;


                                return (
                                    shortStart >=
                                        longStart
                                    &&
                                    shortStart +
                                    motif.length <=
                                        longStart +
                                        longer.length
                                );

                            }
                        );


                    if(!isContained){

                        allContained = false;
                        break;

                    }

                }


                if(!allContained){
                    break;
                }

            }


            if(allContained){

                contained = true;
                break;

            }

        }


        if(!contained){

            result.push(motif);

        }

    }


    return result;
}

function drawInternalMotifGraph(
    internalMotifs,
    shapeEventDataRight,
    shapeEventDataLeft,
    ticksPerMeasure
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =====================================
    // 上位10件
    // =====================================

    const motifs =
        internalMotifs.slice(0, 10);


    if(!motifs.length){

        ctx.font =
            "14px sans-serif";

        ctx.fillStyle =
            "black";

        ctx.fillText(
            "No Internal Motifs",
            30,
            40
        );

        return;
    }


    // =====================================
    // Event
    // =====================================

    const rightEvents =
        Object.values(
            shapeEventDataRight
        );

    const leftEvents =
        Object.values(
            shapeEventDataLeft
        );


    const allEvents = [
        ...rightEvents,
        ...leftEvents
    ];


    if(!allEvents.length){

        return;
    }


    // =====================================
    // 最大start
    // =====================================

    let maxStart = 0;

    for(
        const event
        of allEvents
    ){

        if(
            typeof event.start === "number" &&
            event.start > maxStart
        ){

            maxStart =
                event.start;

        }

    }


    // =====================================
    // 最後の小節
    // =====================================

    const maxMeasure =
        Math.floor(
            maxStart /
            ticksPerMeasure
        ) + 1;


    // =====================================
    // 楽曲全体のtick範囲
    // 最後の小節の終わりまで
    // =====================================

    const totalTicks =
        maxMeasure *
        ticksPerMeasure;


    // =====================================
    // サイズ
    // =====================================

    const measureWidth = 55;
    const eventWidth = 55;

    const marginLeft =
        measureWidth * 1 +
        eventWidth * 2 +
        10;

    const marginTop = 65;

    const motifWidth = 180;

    const graphTop = 105;


    // =====================================
    // 縦方向
    // =====================================

    const maxGraphHeight =
        Math.min(
            700,
            window.innerHeight -
            graphTop -
            30
        );


    const timeScale =
        maxGraphHeight /
        totalTicks;


    // =====================================
    // Canvas
    // =====================================

    canvas.width =
        marginLeft +
        motifs.length *
        motifWidth +
        30;

    canvas.height =
        graphTop +
        maxGraphHeight +
        40;


    // =====================================
    // start → Y
    // =====================================

    function getY(start){

        return (
            graphTop +
            start *
            timeScale
        );

    }


    // =====================================
    // Event番号
    // 左右独立
    // =====================================

    ctx.fillStyle =
        "black";

    ctx.font =
        "11px sans-serif";

    ctx.textAlign =
        "right";


    // -------------------------------------
    // Left Event
    // -------------------------------------
    for(
        const event
        of leftEvents
    ){

        if(
            event.event % 10 !== 0
        ){
            continue;
        }

        const y =
            getY(event.start);

        ctx.fillText(
            String(event.event),
            measureWidth +
            eventWidth -
            5,
            y + 4
        );

    }

    // -------------------------------------
    // Right Event
    // -------------------------------------

    for(
        const event
        of rightEvents
    ){

        if(
            event.event % 10 !== 0
        ){
            continue;
        }

        const y =
            getY(event.start);

        ctx.fillText(
            String(event.event),
            measureWidth +
            eventWidth * 2 -
            5,
            y + 4
        );

    }
    // =====================================
    // 見出し
    // =====================================

    ctx.fillStyle =
        "black";

    ctx.font =
        "bold 10px sans-serif";

    ctx.textAlign =
        "right";

    ctx.fillText(
        "Measure",
        measureWidth - 5,
        graphTop - 30
    );

    ctx.fillText(
        "L Event",
        measureWidth +
        eventWidth -
        5,
        graphTop - 30
    );

    ctx.fillText(
        "R Event",
        measureWidth +
        eventWidth * 2 -
        5,
        graphTop - 30
    );

    // =====================================
    // L / R Measure
    // 各Eventのstartから独立して計算
    // =====================================

    ctx.font =
        "11px sans-serif";

    ctx.fillStyle =
        "black";


    // =====================================
    // 小節線
    // 右手・左手とは独立
    // 1小節につき1本だけ
    // =====================================

    for(
        let measure = 1;
        measure <= maxMeasure;
        measure++
    ){

        const measureStart =
            (measure - 1) *
            ticksPerMeasure;


        const y =
            getY(measureStart);


        ctx.strokeStyle =
            "#cccccc";

        ctx.lineWidth =
            1;


        ctx.beginPath();

        ctx.moveTo(
            10,
            y
        );

        ctx.lineTo(
            marginLeft +
            motifs.length *
            motifWidth -
            10,
            y
        );

        ctx.stroke();

        ctx.fillText(
            String(measure),
            measureWidth - 5,
            y + 14
        );


    }


    // =====================================
    // Motif
    // =====================================

    motifs.forEach(
        (motif, motifIndex) => {

            const x =
                marginLeft +
                motifIndex *
                motifWidth;


            // =================================
            // Motif区切り線
            // =================================

            ctx.strokeStyle =
                "#888";

            ctx.lineWidth =
                1;

            ctx.beginPath();

            ctx.moveTo(
                x,
                graphTop - 45
            );

            ctx.lineTo(
                x,
                graphTop +
                maxGraphHeight
            );

            ctx.stroke();


            // =================================
            // Title
            // =================================

            ctx.textAlign =
                "left";

            ctx.font =
                "bold 12px sans-serif";

            ctx.fillStyle =
                "black";


            ctx.fillText(
                "Internal Motif " +
                motif.motifId +
                " (" +
                motif.length +
                ")",
                x + 5,
                marginTop
            );


            // =================================
            // L / R
            // =================================

            ctx.font =
                "bold 11px sans-serif";


            ctx.fillText(
                "L",
                x + 25,
                marginTop + 18
            );


            ctx.fillText(
                "R",
                x + 105,
                marginTop + 18
            );


            // =================================
            // 出現位置
            // =================================

            ctx.font =
                "9px sans-serif";


            const leftStarts =
                motif.L.map(
                    occurrence =>
                        occurrence.start
                );


            const rightStarts =
                motif.R.map(
                    occurrence =>
                        occurrence.start
                );


            ctx.fillText(
                leftStarts.length
                    ? leftStarts.join(", ")
                    : "-",
                x + 5,
                marginTop + 32
            );


            ctx.fillText(
                rightStarts.length
                    ? rightStarts.join(", ")
                    : "-",
                x + 85,
                marginTop + 32
            );


            // =================================
            // Motif位置
            // =================================

            const leftPositions =
                new Set();

            const rightPositions =
                new Set();


            // ---------------------------------
            // Left
            // ---------------------------------

            for(
                const occurrence
                of motif.L
            ){

                for(
                    let i = 0;
                    i < motif.length;
                    i++
                ){

                    const eventIndex =
                        occurrence.start +
                        i;


                    const event =
                        shapeEventDataLeft[
                            eventIndex
                        ];


                    if(
                        event &&
                        typeof event.start ===
                        "number"
                    ){

                        leftPositions.add(
                            event.start
                        );

                    }

                }

            }


            // ---------------------------------
            // Right
            // ---------------------------------

            for(
                const occurrence
                of motif.R
            ){

                for(
                    let i = 0;
                    i < motif.length;
                    i++
                ){

                    const eventIndex =
                        occurrence.start +
                        i;


                    const event =
                        shapeEventDataRight[
                            eventIndex
                        ];


                    if(
                        event &&
                        typeof event.start ===
                        "number"
                    ){

                        rightPositions.add(
                            event.start
                        );

                    }

                }

            }

            // =================================
            // Motif内のpitch class位置
            // =================================

            const handWidth =
                motifWidth / 2;

            const pitchWidth =
                handWidth / 12;


            // =================================
            // Left Plot
            // =================================

            for(
                const occurrence
                of motif.L
            ){

                for(
                    let i = 0;
                    i < motif.length;
                    i++
                ){

                    const eventIndex =
                        occurrence.start + i;


                    const event =
                        shapeEventDataLeft[eventIndex];


                    if(!event){
                        continue;
                    }


                    // -----------------------------
                    // Event内の各note
                    // -----------------------------

                    for(
                        const point
                        of event.points
                    ){

                        const start =
                            point.start;


                        const pitchClass =
                            point.pitchClass;


                        const y =
                            getY(start);


                        const px =
                            x +
                            (pitchClass + 0.5) *
                            pitchWidth;


                        // -------------------------
                        // 元のpitch classの色
                        // -------------------------

                        ctx.fillStyle =
                            workingColor.pc[pitchClass];


                        ctx.beginPath();

                        ctx.arc(
                            px,
                            y,
                            3,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();

                    }

                }

            }


            // =================================
            // Right Plot
            // =================================

            for(
                const occurrence
                of motif.R
            ){

                for(
                    let i = 0;
                    i < motif.length;
                    i++
                ){

                    const eventIndex =
                        occurrence.start + i;


                    const event =
                        shapeEventDataRight[eventIndex];


                    if(!event){
                        continue;
                    }


                    // -----------------------------
                    // Event内の各note
                    // -----------------------------

                    for(
                        const point
                        of event.points
                    ){

                        const start =
                            point.start;


                        const pitchClass =
                            point.pitchClass;


                        const y =
                            getY(start);


                        const px =
                            x +
                            handWidth +
                            (pitchClass + 0.5) *
                            pitchWidth;


                        // -------------------------
                        // 元のpitch classの色
                        // -------------------------

                        ctx.fillStyle =
                            workingColor.pc[pitchClass];


                        ctx.beginPath();

                        ctx.arc(
                            px,
                            y,
                            3,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();

                    }

                }

            }
            // =================================
            // Motifの範囲を四角で囲む
            // =================================

            ctx.strokeStyle =
                "#555";

            ctx.lineWidth =
                1.5;


            // ---------------------------------
            // Left Motif
            // ---------------------------------

            for(
                const occurrence
                of motif.L
            ){

                const firstEvent =
                    shapeEventDataLeft[
                        occurrence.start
                    ];

                const lastEvent =
                    shapeEventDataLeft[
                        occurrence.start +
                        motif.length -
                        1
                    ];

                if(
                    !firstEvent ||
                    !lastEvent
                ){
                    continue;
                }


                const y1 =
                    getY(firstEvent.start);

                const y2 =
                    getY(lastEvent.start);


                ctx.strokeRect(
                    x,
                    y1 - 4,
                    handWidth,
                    (y2 - y1) + 8
                );

            }


            // ---------------------------------
            // Right Motif
            // ---------------------------------

            for(
                const occurrence
                of motif.R
            ){

                const firstEvent =
                    shapeEventDataRight[
                        occurrence.start
                    ];

                const lastEvent =
                    shapeEventDataRight[
                        occurrence.start +
                        motif.length -
                        1
                    ];

                if(
                    !firstEvent ||
                    !lastEvent
                ){
                    continue;
                }


                const y1 =
                    getY(firstEvent.start);

                const y2 =
                    getY(lastEvent.start);


                ctx.strokeRect(
                    x + handWidth,
                    y1 - 4,
                    handWidth,
                    (y2 - y1) + 8
                );

            }

        }
    );


    // =====================================
    // 右端のMotif区切り線
    // =====================================

    const lastX =
        marginLeft +
        motifs.length *
        motifWidth;


    ctx.strokeStyle =
        "#888";

    ctx.lineWidth =
        1;


    ctx.beginPath();

    ctx.moveTo(
        lastX,
        graphTop - 45
    );

    ctx.lineTo(
        lastX,
        graphTop +
        maxGraphHeight
    );

    ctx.stroke();


    ctx.textAlign =
        "left";

}
